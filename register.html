<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Personal Chatbot Partner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81, #701a75);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7c3aed;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #d1d5db;
    }

    a {
      color: #c4b5fd;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Create Account</h1>

    <div class="subtitle">
      Create your account to get started
    </div>

    <form>

      <label>Name</label>
      <input
        type="text"
        placeholder="Enter your name"
        required
      >

      <label>Email</label>
      <input
        type="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        placeholder="Create a password"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="index.html">Login</a>
    </div>

  </div>

</body>
</html>
