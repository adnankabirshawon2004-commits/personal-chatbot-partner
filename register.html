<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Personal Chatbot Partner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81, #701a75);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7c3aed;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #d1d5db;
    }

    a {
      color: #c4b5fd;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Create Account</h1>

    <div class="subtitle">
      Create your account to get started
    </div>

    <form id="registerForm">

      <label>Name</label>

      <input
        id="name"
        type="text"
        placeholder="Enter your name"
        required
      >

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <button id="registerButton" type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="index.html">Login</a>
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("registerForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const button =
      document.getElementById("registerButton");

    const message =
      document.getElementById("message");


    button.disabled = true;

    button.textContent = "Creating account...";

    message.textContent = "";


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });


      if (error) {
        throw error;
      }


      if (!data.user) {
        throw new Error("Account could not be created.");
      }


      const { error: profileError } =
        await supabaseClient
          .from("profiles")
          .insert({
            id: data.user.id,
            name: name,
            email: email,
            role: "user",
            status: "pending"
          });


      if (profileError) {
        throw profileError;
      }


      message.style.color = "#86efac";

      message.innerHTML =
        "Account created successfully!<br>" +
        "Your account is waiting for admin approval.";


      document.getElementById("registerForm").reset();

    }

    catch (error) {

      message.style.color = "#fca5a5";

      message.textContent =
        error.message || "Something went wrong.";

    }


    button.disabled = false;

    button.textContent = "Create Account";

  });

</script>

</body>
</html>
