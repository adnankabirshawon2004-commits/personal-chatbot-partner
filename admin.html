<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Personal Chatbot Partner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 22px;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 600;
    }

    .chat-panel-btn {
      background: #6366f1;
      color: white;
    }

    .chat-panel-btn:hover {
      background: #4f46e5;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #6b7280;
    }

    .message {
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .section h3 {
      margin-bottom: 18px;
      font-size: 20px;
    }

    .user-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 17px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .user-info h4 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .user-info p {
      color: #6b7280;
      font-size: 13px;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .approve:hover {
      background: #15803d;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .reject:hover {
      background: #b91c1c;
    }

    .chat {
      background: #4f46e5;
      color: white;
    }

    .chat:hover {
      background: #4338ca;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 25px;
    }

    .status {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .pending-status {
      background: #fef3c7;
      color: #92400e;
    }

    .approved-status {
      background: #dcfce7;
      color: #166534;
    }

    .rejected-status {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
      }

      .user-card {
        align-items: flex-start;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>

</head>

<body>

<header>
  <h1>🛠 Admin Panel</h1>

  <div class="header-buttons">
    <button class="chat-panel-btn" onclick="openChatPanel()">
      💬 Open Chat Panel
    </button>

```
<button class="logout-btn" onclick="logout()">
  Logout
</button>
```

  </div>
</header>

<main>

  <div class="welcome">
    <h2>Welcome, Admin</h2>
    <p>Manage users and communicate with approved users.</p>
  </div>

  <div id="errorMessage" class="message error"></div>
  <div id="successMessage" class="message success"></div>

  <!-- Pending Users -->

  <div class="section">
    <h3>⏳ Pending Users</h3>

```
<div id="pendingUsers">
  <div class="loading">Loading users...</div>
</div>
```

  </div>

  <!-- Approved Users -->

  <div class="section">
    <h3>✅ Approved Users</h3>

```
<div id="approvedUsers">
  <div class="loading">Loading users...</div>
</div>
```

  </div>

</main>

<script>
  const SUPABASE_URL = "https://bnagfjhghlncqqnenejn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentAdmin = null;

  function showError(message) {
    const box = document.getElementById("errorMessage");
    box.textContent = message;
    box.style.display = "block";

    document.getElementById("successMessage").style.display = "none";
  }

  function showSuccess(message) {
    const box = document.getElementById("successMessage");
    box.textContent = message;
    box.style.display = "block";

    document.getElementById("errorMessage").style.display = "none";

    setTimeout(() => {
      box.style.display = "none";
    }, 3000);
  }

  async function checkAdmin() {
    try {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.replace("index.html");
        return false;
      }

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.replace("index.html");
        return false;
      }

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("id, name, email, role, status")
          .eq("id", user.id)
          .single();

      if (profileError || !profile) {
        await supabaseClient.auth.signOut();
        window.location.replace("index.html");
        return false;
      }

      if (
        profile.role !== "admin" ||
        profile.status !== "approved"
      ) {
        await supabaseClient.auth.signOut();
        window.location.replace("index.html");
        return false;
      }

      currentAdmin = profile;

      return true;

    } catch (error) {
      console.error(error);
      window.location.replace("index.html");
      return false;
    }
  }

  async function loadUsers() {
    const pendingContainer =
      document.getElementById("pendingUsers");

    const approvedContainer =
      document.getElementById("approvedUsers");

    pendingContainer.innerHTML =
      '<div class="loading">Loading users...</div>';

    approvedContainer.innerHTML =
      '<div class="loading">Loading users...</div>';

    const { data: users, error } =
      await supabaseClient
        .from("profiles")
        .select("id, name, email, role, status, created_at")
        .eq("role", "user")
        .order("created_at", {
          ascending: false
        });

    if (error) {
      console.error(error);
      showError(error.message);

      pendingContainer.innerHTML =
        '<div class="empty">Unable to load users.</div>';

      approvedContainer.innerHTML =
        '<div class="empty">Unable to load users.</div>';

      return;
    }

    const pendingUsers =
      users.filter(user => user.status === "pending");

    const approvedUsers =
      users.filter(user => user.status === "approved");

    renderPendingUsers(pendingUsers);
    renderApprovedUsers(approvedUsers);
  }

  function renderPendingUsers(users) {
    const container =
      document.getElementById("pendingUsers");

    if (users.length === 0) {
      container.innerHTML =
        '<div class="empty">No pending users.</div>';
      return;
    }

    container.innerHTML = users.map(user => `
      <div class="user-card">

        <div class="user-info">
          <h4>${escapeHtml(user.name || "Unnamed User")}</h4>

          <p>${escapeHtml(user.email || "")}</p>

          <span class="status pending-status">
            Pending
          </span>
        </div>

        <div class="actions">

          <button
            class="approve"
            onclick="updateStatus('${user.id}', 'approved')">
            ✓ Approve
          </button>

          <button
            class="reject"
            onclick="updateStatus('${user.id}', 'rejected')">
            ✕ Reject
          </button>

        </div>

      </div>
    `).join("");
  }

  function renderApprovedUsers(users) {
    const container =
      document.getElementById("approvedUsers");

    if (users.length === 0) {
      container.innerHTML =
        '<div class="empty">No approved users yet.</div>';
      return;
    }

    container.innerHTML = users.map(user => `
      <div class="user-card">

        <div class="user-info">
          <h4>${escapeHtml(user.name || "Unnamed User")}</h4>

          <p>${escapeHtml(user.email || "")}</p>

          <span class="status approved-status">
            Approved
          </span>
        </div>

        <div class="actions">

          <button
            class="chat"
            onclick="openUserChat('${user.id}')">
            💬 Chat
          </button>

        </div>

      </div>
    `).join("");
  }

  async function updateStatus(userId, newStatus) {

    const buttonMessage =
      newStatus === "approved"
        ? "Approve this user?"
        : "Reject this user?";

    if (!confirm(buttonMessage)) {
      return;
    }

    const { error } =
      await supabaseClient
        .from("profiles")
        .update({
          status: newStatus
        })
        .eq("id", userId);

    if (error) {
      console.error(error);
      showError(
        "Could not update user: " + error.message
      );
      return;
    }

    showSuccess(
      newStatus === "approved"
        ? "User approved successfully."
        : "User rejected successfully."
    );

    await loadUsers();
  }

  function openChatPanel() {
    window.location.href = "admin-chat.html";
  }

  function openUserChat(userId) {
    window.location.href =
      "admin-chat.html?user=" +
      encodeURIComponent(userId);
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.replace("index.html");
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (
        event === "SIGNED_OUT" ||
        !session
      ) {
        window.location.replace("index.html");
      }
    }
  );

  async function start() {

    const isAdmin = await checkAdmin();

    if (!isAdmin) {
      return;
    }

    await loadUsers();
  }

  start();
</script>

</body>
</html>
