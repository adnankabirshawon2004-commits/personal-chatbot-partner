<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel - Personal Chatbot Partner</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #111827,
          #312e81,
          #701a75
        );

      color: white;

    }

    .container {

      width: 92%;

      max-width: 1100px;

      margin: auto;

      padding: 30px 0;

    }

    .header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 30px;

    }

    .header h1 {

      margin: 0;

    }

    .logout {

      border: none;

      padding: 10px 18px;

      border-radius: 10px;

      background: #ef4444;

      color: white;

      cursor: pointer;

      font-weight: bold;

    }

    .card {

      background:
        rgba(255,255,255,0.10);

      border:
        1px solid rgba(255,255,255,0.15);

      border-radius: 18px;

      padding: 22px;

      margin-bottom: 20px;

      backdrop-filter: blur(15px);

    }

    .card h2 {

      margin-top: 0;

    }

    .user {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      padding: 18px;

      margin-top: 15px;

      border-radius: 14px;

      background:
        rgba(0,0,0,0.20);

    }

    .info {

      flex: 1;

    }

    .name {

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 6px;

    }

    .email {

      color: #d1d5db;

      margin-bottom: 8px;

    }

    .status {

      display: inline-block;

      padding: 5px 10px;

      border-radius: 20px;

      background: #f59e0b;

      font-size: 13px;

    }

    .actions {

      display: flex;

      gap: 10px;

    }

    .approve {

      border: none;

      padding: 10px 18px;

      border-radius: 9px;

      background: #22c55e;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }

    .reject {

      border: none;

      padding: 10px 18px;

      border-radius: 9px;

      background: #ef4444;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }

    .message {

      text-align: center;

      color: #d1d5db;

      padding: 20px;

    }

    @media (max-width: 700px) {

      .header {

        flex-direction: column;

        align-items: flex-start;

      }

      .user {

        flex-direction: column;

        align-items: flex-start;

      }

      .actions {

        width: 100%;

      }

      .actions button {

        flex: 1;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <div>

      <h1>Admin Panel</h1>

      <p>Personal Chatbot Partner</p>

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div class="card">

    <h2>Pending Accounts</h2>

    <div id="users">

      <div class="message">
        Loading users...
      </div>

    </div>

  </div>


</div>


<script>


const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadUsers() {


  const usersContainer =
    document.getElementById("users");


  const {
    data: users,
    error
  } =
    await supabaseClient

      .from("profiles")

      .select(
        "id, name, email, role, status, created_at"
      )

      .eq("status", "pending")

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    usersContainer.innerHTML =
      `
      <div class="message">
        Error loading users:<br>
        ${escapeHtml(error.message)}
      </div>
      `;

    return;

  }


  if (!users || users.length === 0) {

    usersContainer.innerHTML =
      `
      <div class="message">
        No pending accounts.
      </div>
      `;

    return;

  }


  usersContainer.innerHTML = "";


  users.forEach(user => {


    const div =
      document.createElement("div");


    div.className = "user";


    div.innerHTML =
      `

      <div class="info">

        <div class="name">
          ${escapeHtml(user.name)}
        </div>

        <div class="email">
          ${escapeHtml(user.email || "")}
        </div>

        <span class="status">
          Pending
        </span>

      </div>


      <div class="actions">

        <button
          class="approve"
          onclick="updateStatus(
            '${user.id}',
            'approved'
          )"
        >
          Approve
        </button>


        <button
          class="reject"
          onclick="updateStatus(
            '${user.id}',
            'rejected'
          )"
        >
          Reject
        </button>

      </div>

      `;


    usersContainer.appendChild(div);


  });


}


async function updateStatus(
  userId,
  newStatus
) {


  const {
    error
  } =
    await supabaseClient

      .from("profiles")

      .update({
        status: newStatus
      })

      .eq(
        "id",
        userId
      );


  if (error) {

    alert(
      "Could not update account:\n" +
      error.message
    );

    return;

  }


  await loadUsers();

}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";

}


function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


loadUsers();


</script>


</body>

</html>
