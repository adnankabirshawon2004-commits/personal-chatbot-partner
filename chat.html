<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          rgba(91, 33, 182, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(6, 182, 212, 0.25),
          transparent 35%
        ),
        #070b14;

      color: #fff;

      display: flex;
      justify-content: center;

      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 900px;

      height: calc(100vh - 36px);
      min-height: 550px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: rgba(15, 23, 42, 0.72);

      border: 1px solid rgba(255,255,255,0.10);

      border-radius: 24px;

      backdrop-filter: blur(22px);

      box-shadow:
        0 25px 80px rgba(0,0,0,0.45);
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      min-height: 78px;

      display: flex;
      align-items: center;

      gap: 14px;

      padding: 14px 18px;

      border-bottom:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(15,23,42,0.65);
    }

    .back {
      width: 42px;
      height: 42px;

      border: none;

      border-radius: 14px;

      background:
        rgba(255,255,255,0.08);

      color: white;

      font-size: 22px;

      cursor: pointer;

      flex-shrink: 0;
    }

    .avatar {
      width: 46px;
      height: 46px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #06b6d4
        );

      box-shadow:
        0 8px 25px rgba(124,58,237,0.35);

      flex-shrink: 0;

      overflow: hidden;

      border:
        2px solid rgba(255,255,255,0.12);
    }

    .avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .character-info {
      min-width: 0;
      flex: 1;
    }

    .character-name {
      font-size: 17px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin-top: 4px;

      font-size: 12px;

      color: #4ade80;

      display: flex;
      align-items: center;

      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #4ade80;

      box-shadow:
        0 0 10px #4ade80;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 24px 18px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-thumb {
      background:
        rgba(255,255,255,0.14);

      border-radius: 10px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.admin {
      justify-content: flex-start;
    }

    .bubble {
      max-width:
        min(72%, 560px);

      padding: 11px 14px;

      border-radius: 18px;

      word-wrap: break-word;

      overflow-wrap: anywhere;

      font-size: 14px;

      line-height: 1.5;
    }

    .message-row.user .bubble {
      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #2563eb
        );

      border-bottom-right-radius: 5px;

      box-shadow:
        0 8px 25px rgba(37,99,235,0.20);
    }

    .message-row.admin .bubble {
      background:
        rgba(255,255,255,0.09);

      border:
        1px solid rgba(255,255,255,0.08);

      border-bottom-left-radius: 5px;
    }

    .message-image {
      display: block;

      width: 100%;

      max-width: 330px;

      max-height: 420px;

      object-fit: contain;

      border-radius: 13px;

      cursor: pointer;

      background:
        rgba(0,0,0,0.15);
    }

    .message-text {
      margin-top: 8px;

      white-space: pre-wrap;
    }

    .message-text.only {
      margin-top: 0;
    }

    .time {
      margin-top: 5px;

      font-size: 10px;

      opacity: 0.55;

      text-align: right;
    }

    .empty {
      margin: auto;

      text-align: center;

      color:
        rgba(255,255,255,0.55);

      padding: 30px;
    }

    .empty-icon {
      font-size: 42px;

      margin-bottom: 12px;
    }

    /* =========================
       PREVIEW
    ========================= */

    .preview-container {
      display: none;

      padding: 10px 14px;

      border-top:
        1px solid rgba(255,255,255,0.07);

      background:
        rgba(15,23,42,0.75);
    }

    .preview-container.show {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .preview-image {
      width: 64px;
      height: 64px;

      object-fit: cover;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,0.12);
    }

    .preview-info {
      flex: 1;
      min-width: 0;
    }

    .preview-name {
      font-size: 13px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .preview-size {
      font-size: 11px;

      opacity: 0.55;

      margin-top: 3px;
    }

    .remove-image {
      width: 34px;
      height: 34px;

      border: none;

      border-radius: 10px;

      background:
        rgba(239,68,68,0.15);

      color: #f87171;

      cursor: pointer;

      font-size: 17px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer {
      padding:
        12px 14px 14px;

      border-top:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(15,23,42,0.72);
    }

    .composer-inner {
      display: flex;

      align-items: flex-end;

      gap: 8px;
    }

    .image-button {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 14px;

      background:
        rgba(255,255,255,0.07);

      color: #c4b5fd;

      font-size: 21px;

      cursor: pointer;
    }

    .image-button:hover {
      background:
        rgba(124,58,237,0.20);
    }

    #messageInput {
      flex: 1;

      min-height: 46px;

      max-height: 130px;

      resize: none;

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 15px;

      background:
        rgba(255,255,255,0.07);

      color: white;

      padding: 13px 14px;

      outline: none;

      font-family: inherit;

      font-size: 14px;

      line-height: 20px;
    }

    #messageInput::placeholder {
      color:
        rgba(255,255,255,0.42);
    }

    #messageInput:focus {
      border-color:
        rgba(124,58,237,0.65);

      box-shadow:
        0 0 0 3px rgba(124,58,237,0.10);
    }

    .send-button {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #2563eb
        );

      color: white;

      font-size: 19px;

      cursor: pointer;

      box-shadow:
        0 8px 22px rgba(37,99,235,0.25);
    }

    .send-button:disabled,
    .image-button:disabled {
      opacity: 0.45;

      cursor: not-allowed;
    }

    #fileInput {
      display: none;
    }

    .notice {
      text-align: center;

      font-size: 10px;

      opacity: 0.4;

      margin-top: 7px;
    }

    .loading {
      text-align: center;

      opacity: 0.55;

      padding: 20px;

      font-size: 13px;
    }

    @media (max-width: 600px) {

      body {
        padding: 0;
      }

      .app {
        height: 100vh;

        min-height: 0;

        border-radius: 0;

        border: none;
      }

      .header {
        min-height: 68px;

        padding: 10px 12px;
      }

      .back {
        width: 38px;
        height: 38px;

        border-radius: 12px;
      }

      .avatar {
        width: 40px;
        height: 40px;

        font-size: 19px;
      }

      .character-name {
        font-size: 15px;
      }

      .messages {
        padding:
          16px 12px;
      }

      .bubble {
        max-width: 82%;

        font-size: 14px;
      }

      .message-image {
        max-width: 250px;

        max-height: 330px;
      }

      .composer {
        padding:
          9px 9px 10px;
      }

      .image-button,
      .send-button {
        width: 43px;
        height: 43px;
      }

      #messageInput {
        min-height: 43px;

        padding:
          11px 12px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <button
      class="back"
      onclick="goBack()">
      ‹
    </button>


    <div
      class="avatar"
      id="avatar">

      👤

    </div>


    <div class="character-info">

      <div
        class="character-name"
        id="characterName">

        Chat

      </div>


      <div class="status">

        <span class="status-dot"></span>

        Available

      </div>

    </div>

  </div>


  <!-- MESSAGES -->

  <div
    class="messages"
    id="messages">

    <div class="loading">
      Loading chat...
    </div>

  </div>


  <!-- IMAGE PREVIEW -->

  <div
    class="preview-container"
    id="previewContainer">

    <img
      class="preview-image"
      id="previewImage">

    <div class="preview-info">

      <div
        class="preview-name"
        id="previewName">
      </div>

      <div
        class="preview-size"
        id="previewSize">
      </div>

    </div>


    <button
      class="remove-image"
      onclick="removeSelectedImage()">

      ×

    </button>

  </div>


  <!-- COMPOSER -->

  <div class="composer">

    <div class="composer-inner">

      <button
        class="image-button"
        id="imageButton"
        onclick="document.getElementById('fileInput').click()">

        🖼️

      </button>


      <input
        type="file"
        id="fileInput"
        accept="image/jpeg,image/png,image/webp,image/gif"
      >


      <textarea
        id="messageInput"
        placeholder="Write a message..."
        rows="1">
      </textarea>


      <button
        class="send-button"
        id="sendButton"
        onclick="sendMessage()">

        ➤

      </button>

    </div>


    <div class="notice">

      Press Enter to send • Shift + Enter for new line

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;

let conversationId = null;

let character = null;

let realtimeChannel = null;

let selectedImage = null;


/* =========================
   INIT
========================= */

async function init() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    window.location.replace(
      "index.html"
    );

    return;
  }


  currentUser =
    session.user;


  await loadCharacter();

}


/* =========================
   CHARACTER
========================= */

async function loadCharacter() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const characterId =
    params.get("id");


  if (!characterId) {

    alert(
      "Character not found."
    );

    window.location.replace(
      "dashboard.html"
    );

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("characters")
      .select("*")
      .eq(
        "id",
        characterId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .single();


  if (error || !data) {

    console.error(error);

    alert(
      "Character not found."
    );

    window.location.replace(
      "dashboard.html"
    );

    return;
  }


  character =
    data;


  const displayName =
    character.custom_character ||
    character.character_type ||
    "Chat";


  document
    .getElementById(
      "characterName"
    )
    .textContent =
      displayName;


  await loadCharacterAvatar();


  await loadConversation();

}


/* =========================
   CHARACTER AVATAR
========================= */

async function loadCharacterAvatar() {

  const avatar =
    document.getElementById(
      "avatar"
    );


  if (
    !character.avatar_url
  ) {

    avatar.textContent =
      getAvatar(
        character.character_type
      );

    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          "character-avatars"
        )
        .createSignedUrl(
          character.avatar_url,
          3600
        );


    if (
      !error &&
      data &&
      data.signedUrl
    ) {

      avatar.innerHTML = `
        <img
          src="${data.signedUrl}"
          alt="Character picture">
      `;

    } else {

      avatar.textContent =
        getAvatar(
          character.character_type
        );

    }

  } catch (error) {

    console.error(
      "Avatar error:",
      error
    );


    avatar.textContent =
      getAvatar(
        character.character_type
      );

  }

}


function getAvatar(type) {

  const avatars = {

    Father: "👨",

    Mother: "👩",

    Boyfriend: "🧑",

    Girlfriend: "👩",

    "Male Teacher": "👨‍🏫",

    "Female Teacher": "👩‍🏫",

    Other: "💬"

  };


  return avatars[type] ||
    "💬";
}


/* =========================
   CONVERSATION
========================= */

async function loadConversation() {

  let {
    data,
    error
  } =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "character_id",
        character.id
      )
      .maybeSingle();


  if (error) {

    console.error(error);

    showError(
      "Could not load conversation."
    );

    return;
  }


  if (!data) {

    const result =
      await supabaseClient
        .from("conversations")
        .insert({

          user_id:
            currentUser.id,

          character_id:
            character.id

        })
        .select()
        .single();


    if (result.error) {

      console.error(
        result.error
      );

      showError(
        "Could not create conversation."
      );

      return;
    }


    data =
      result.data;

  }


  conversationId =
    data.id;


  await loadMessages();


  startRealtime();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

  const container =
    document.getElementById(
      "messages"
    );


  container.innerHTML =
    "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    showError(
      "Could not load messages."
    );

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    showEmpty();

    return;
  }


  for (
    const message of data
  ) {

    await addMessageToUI(
      message
    );

  }


  scrollToBottom();

}


/* =========================
   ADD MESSAGE
========================= */

async function addMessageToUI(
  message
) {

  const container =
    document.getElementById(
      "messages"
    );


  if (message.id) {

    const existing =
      document.querySelector(
        `[data-message-id="${message.id}"]`
      );


    if (existing) {
      return;
    }

  }


  const isUser =
    message.sender_id ===
    currentUser.id;


  const row =
    document.createElement(
      "div"
    );


  row.className =
    `message-row ${
      isUser
        ? "user"
        : "admin"
    }`;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  if (message.id) {

    bubble.dataset.messageId =
      message.id;

  }


  /* IMAGE */

  if (message.image_path) {

    const image =
      document.createElement(
        "img"
      );


    image.className =
      "message-image";


    image.alt =
      message.image_name ||
      "Chat image";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from("chat-images")
          .createSignedUrl(
            message.image_path,
            3600
          );


      if (
        !error &&
        data &&
        data.signedUrl
      ) {

        image.src =
          data.signedUrl;


        image.onclick =
          function() {

            window.open(
              data.signedUrl,
              "_blank"
            );

          };

      } else {

        image.alt =
          "Image unavailable";

      }

    } catch (error) {

      console.error(
        "Image error:",
        error
      );

      image.alt =
        "Image unavailable";

    }


    bubble.appendChild(
      image
    );

  }


  /* TEXT */

  if (message.content) {

    const text =
      document.createElement(
        "div"
      );


    text.className =
      message.image_path
        ? "message-text"
        : "message-text only";


    text.textContent =
      message.content;


    bubble.appendChild(
      text
    );

  }


  /* TIME */

  const time =
    document.createElement(
      "div"
    );


  time.className =
    "time";


  time.textContent =
    formatTime(
      message.created_at
    );


  bubble.appendChild(
    time
  );


  row.appendChild(
    bubble
  );


  container.appendChild(
    row
  );


  scrollToBottom();

}


/* =========================
   IMAGE SELECT
========================= */

document
  .getElementById(
    "fileInput"
  )
  .addEventListener(
    "change",
    handleImageSelect
  );


function handleImageSelect(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Please select an image."
    );

    event.target.value =
      "";

    return;
  }


  if (
    file.size >
    10 * 1024 * 1024
  ) {

    alert(
      "Image must be smaller than 10 MB."
    );

    event.target.value =
      "";

    return;
  }


  selectedImage =
    file;


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      document
        .getElementById(
          "previewImage"
        )
        .src =
          e.target.result;


      document
        .getElementById(
          "previewName"
        )
        .textContent =
          file.name;


      document
        .getElementById(
          "previewSize"
        )
        .textContent =
          formatFileSize(
            file.size
          );


      document
        .getElementById(
          "previewContainer"
        )
        .classList.add(
          "show"
        );

    };


  reader.readAsDataURL(
    file
  );

}


/* =========================
   REMOVE SELECTED IMAGE
========================= */

function removeSelectedImage() {

  selectedImage =
    null;


  document.getElementById(
    "fileInput"
  ).value =
    "";


  document
    .getElementById(
      "previewContainer"
    )
    .classList.remove(
      "show"
    );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  const content =
    input.value.trim();


  if (
    !content &&
    !selectedImage
  ) {

    return;
  }


  const sendButton =
    document.getElementById(
      "sendButton"
    );


  const imageButton =
    document.getElementById(
      "imageButton"
    );


  sendButton.disabled =
    true;


  imageButton.disabled =
    true;


  try {

    let imagePath =
      null;

    let imageType =
      null;

    let imageName =
      null;


    /* UPLOAD IMAGE */

    if (selectedImage) {

      const extension =
        selectedImage.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        `${currentUser.id}/${conversationId}/${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const {
        error:
          uploadError
      } =
        await supabaseClient
          .storage
          .from("chat-images")
          .upload(
            fileName,
            selectedImage,
            {
              contentType:
                selectedImage.type,

              upsert:
                false
            }
          );


      if (uploadError) {

        throw uploadError;

      }


      imagePath =
        fileName;

      imageType =
        selectedImage.type;

      imageName =
        selectedImage.name;

    }


    /* INSERT MESSAGE */

    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({

          conversation_id:
            conversationId,

          sender_id:
            currentUser.id,

          content:
            content,

          image_path:
            imagePath,

          image_type:
            imageType,

          image_name:
            imageName

        });


    if (error) {

      throw error;

    }


    input.value =
      "";

    input.style.height =
      "46px";


    removeSelectedImage();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Could not send message. Please try again."
    );


  } finally {

    sendButton.disabled =
      false;

    imageButton.disabled =
      false;

    input.focus();

  }

}


/* =========================
   REALTIME
========================= */

function startRealtime() {

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "chat-" +
        conversationId
      )
      .on(
        "postgres_changes",
        {
          event:
            "INSERT",

          schema:
            "public",

          table:
            "messages",

          filter:
            `conversation_id=eq.${conversationId}`

        },

        async payload => {

          await addMessageToUI(
            payload.new
          );

        }

      )
      .subscribe(
        status => {

          console.log(
            "Realtime status:",
            status
          );

        }
      );

}

function showEmpty() {

  document.getElementById(
    "messages"
  ).innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        💬
      </div>

      <div>
        Start your conversation
      </div>

    </div>

  `;

}


function showError(
  message
) {

  document.getElementById(
    "messages"
  ).innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        ⚠️
      </div>

      <div>
        ${message}
      </div>

    </div>

  `;

}


function formatTime(
  dateString
) {

  return new Date(
    dateString
  ).toLocaleTimeString(
    [],
    {
      hour:
        "2-digit",

      minute:
        "2-digit"
    }
  );

}


function formatFileSize(
  bytes
) {

  if (bytes < 1024) {

    return bytes + " B";

  }


  if (
    bytes <
    1024 * 1024
  ) {

    return (
      bytes / 1024
    ).toFixed(1) +
      " KB";

  }


  return (
    bytes /
    (1024 * 1024)
  ).toFixed(1) +
    " MB";

}


function scrollToBottom() {

  const container =
    document.getElementById(
      "messages"
    );


  setTimeout(
    () => {

      container.scrollTop =
        container.scrollHeight;

    },
    30
  );

}


function goBack() {

  window.location.replace(
    "dashboard.html"
  );

}


/* =========================
   TEXTAREA
========================= */

const messageInput =
  document.getElementById(
    "messageInput"
  );


messageInput.addEventListener(
  "input",
  function() {

    this.style.height =
      "46px";


    this.style.height =
      Math.min(
        this.scrollHeight,
        130
      ) + "px";

  }
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   START
========================= */

init();


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (realtimeChannel) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

  }
);

</script>
