<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat - Personal Chatbot Partner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81, #701a75);
      color: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .character-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .character-name {
      font-size: 17px;
      font-weight: bold;
    }

    .character-details {
      font-size: 12px;
      color: #d1d5db;
      margin-top: 3px;
    }

    .back-button {
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .messages {
      max-width: 850px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 16px;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #8b5cf6;
      border-bottom-right-radius: 4px;
    }

    .message.admin {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.12);
      border-bottom-left-radius: 4px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      color: #d1d5db;
      margin-top: 5px;
      opacity: 0.8;
    }

    .empty {
      text-align: center;
      color: #d1d5db;
      margin-top: 80px;
    }

    .typing {
      display: none;
      max-width: 850px;
      margin: 0 auto 10px;
      color: #d1d5db;
      font-size: 13px;
    }

    .input-area {
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 15px;
      background: white;
      color: #111827;
    }

    #sendButton {
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #7c3aed;
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #errorMessage {
      text-align: center;
      color: #fca5a5;
      font-size: 13px;
      margin-top: 7px;
    }

    @media (max-width: 600px) {

      .header {
        padding: 0 12px;
      }

      .character-name {
        font-size: 15px;
      }

      .message {
        max-width: 85%;
      }

      .chat-area {
        padding: 15px 10px;
      }

      #sendButton {
        padding: 0 15px;
      }
    }
  </style>

</head>

<body>

  <header class="header">

    <div class="character-info">

      <div class="avatar" id="avatar">
        💬
      </div>

      <div>
        <div class="character-name" id="characterName">
          Loading...
        </div>

        <div class="character-details" id="characterDetails">
          Loading...
        </div>
      </div>

    </div>

    <button
      class="back-button"
      onclick="goBack()"
    >
      ← Back
    </button>

  </header>


  <main class="chat-area">

    <div
      id="messages"
      class="messages"
    >

      <div
        id="emptyMessage"
        class="empty"
      >
        No messages yet.<br>
        Start the conversation.
      </div>

    </div>

  </main>


  <div
    id="typing"
    class="typing"
  >
    Typing...
  </div>


  <div class="input-area">

    <div class="input-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

    <div id="errorMessage"></div>

  </div>


<script>


const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;

let currentCharacter = null;

let currentConversation = null;

let realtimeChannel = null;


const params =
  new URLSearchParams(
    window.location.search
  );


const characterId =
  params.get("id");


const messagesContainer =
  document.getElementById(
    "messages"
  );


const messageInput =
  document.getElementById(
    "messageInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const errorMessage =
  document.getElementById(
    "errorMessage"
  );


/* ENTER KEY */

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* START */

startChat();


async function startChat() {

  try {

    if (!characterId) {

      throw new Error(
        "Character was not found."
      );

    }


    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {

      throw userError;

    }


    if (!user) {

      window.location.href =
        "index.html";

      return;

    }


    currentUser = user;


    /* CHECK PROFILE */

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient

        .from("profiles")

        .select(
          "name, role, status"
        )

        .eq(
          "id",
          user.id
        )

        .single();


    if (profileError) {

      throw profileError;

    }


    if (
      !profile ||
      profile.status !== "approved"
    ) {

      await supabaseClient.auth.signOut();

      window.location.href =
        "index.html";

      return;

    }


    /* GET CHARACTER */

    const {
      data: character,
      error: characterError
    } =
      await supabaseClient

        .from("characters")

        .select("*")

        .eq(
          "id",
          characterId
        )

        .eq(
          "user_id",
          user.id
        )

        .single();


    if (characterError) {

      throw characterError;

    }


    currentCharacter =
      character;


    showCharacter(
      character
    );


    /* FIND EXISTING CONVERSATION */

    let {
      data: conversation,
      error: conversationError
    } =
      await supabaseClient

        .from("conversations")

        .select("*")

        .eq(
          "user_id",
          user.id
        )

        .eq(
          "character_id",
          character.id
        )

        .limit(1)
        .maybeSingle();


    if (conversationError) {

      throw conversationError;

    }


    /* CREATE CONVERSATION */

    if (!conversation) {

      const {
        data: newConversation,
        error: createError
      } =
        await supabaseClient

          .from("conversations")

          .insert({

            user_id:
              user.id,

            character_id:
              character.id

          })

          .select()

          .single();


      if (createError) {

        throw createError;

      }


      conversation =
        newConversation;

    }


    currentConversation =
      conversation;


    await loadMessages();


    setupRealtime();


  } catch (error) {

    console.error(error);

    errorMessage.textContent =
      error.message ||
      "Something went wrong.";

  }

}


/* CHARACTER INFO */

function showCharacter(
  character
) {

  let name =
    character.character_type;


  if (
    character.character_type ===
    "Other" &&
    character.custom_character
  ) {

    name =
      character.custom_character;

  }


  document.getElementById(
    "characterName"
  ).textContent =
    name;


  document.getElementById(
    "characterDetails"
  ).textContent =
    character.language +
    " • " +
    character.chat_experience;


  const avatar =
    document.getElementById(
      "avatar"
    );


  const avatars = {

    Father: "👨",

    Mother: "👩",

    Boyfriend: "💙",

    Girlfriend: "💜",

    "Male Teacher": "👨‍🏫",

    "Female Teacher": "👩‍🏫",

    Other: "✨"

  };


  avatar.textContent =
    avatars[
      character.character_type
    ] || "💬";

}


/* LOAD MESSAGES */

async function loadMessages() {

  const {
    data,
    error
  } =
    await supabaseClient

      .from("messages")

      .select("*")

      .eq(
        "conversation_id",
        currentConversation.id
      )

      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    throw error;

  }


  messagesContainer
    .querySelectorAll(
      ".message"
    )
    .forEach(
      element =>
        element.remove()
    );


  if (!data || data.length === 0) {

    document.getElementById(
      "emptyMessage"
    ).style.display =
      "block";

    return;

  }


  document.getElementById(
    "emptyMessage"
  ).style.display =
    "none";


  data.forEach(
    message => {

      displayMessage(
        message
      );

    }
  );


  scrollToBottom();

}


/* DISPLAY MESSAGE */

function displayMessage(
  message
) {

  const empty =
    document.getElementById(
      "emptyMessage"
    );


  empty.style.display =
    "none";


  const div =
    document.createElement(
      "div"
    );


  const isUser =
    message.sender_id ===
    currentUser.id;


  div.className =
    "message " +
    (
      isUser
        ? "user"
        : "admin"
    );


  const text =
    document.createElement(
      "div"
    );


  text.textContent =
    message.content;


  const time =
    document.createElement(
      "span"
    );


  time.className =
    "message-time";


  const date =
    new Date(
      message.created_at
    );


  time.textContent =
    date.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  div.appendChild(
    text
  );

  div.appendChild(
    time
  );


  messagesContainer.appendChild(
    div
  );


  scrollToBottom();

}


/* SEND MESSAGE */

async function sendMessage() {

  const content =
    messageInput.value.trim();


  if (!content) {

    return;

  }


  if (!currentConversation) {

    errorMessage.textContent =
      "Chat is not ready yet.";

    return;

  }


  sendButton.disabled =
    true;


  messageInput.disabled =
    true;


  errorMessage.textContent =
    "";


  const {
    error
  } =
    await supabaseClient

      .from("messages")

      .insert({

        conversation_id:
          currentConversation.id,

        sender_id:
          currentUser.id,

        content:
          content

      });


  if (error) {

    console.error(error);

    errorMessage.textContent =
      error.message;

  } else {

    messageInput.value =
      "";

  }


  messageInput.disabled =
    false;

  sendButton.disabled =
    false;

  messageInput.focus();

}


/* REALTIME */

function setupRealtime() {

  if (!currentConversation) {

    return;

  }


  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient

      .channel(
        "conversation-" +
        currentConversation.id
      )

      .on(

        "postgres_changes",

        {

          event: "INSERT",

          schema: "public",

          table: "messages",

          filter:
            "conversation_id=eq." +
            currentConversation.id

        },

        payload => {

          const message =
            payload.new;


          displayMessage(
            message
          );

        }

      )

      .subscribe(

        status => {

          console.log(
            "Realtime status:",
            status
          );

        }

      );

}


/* SCROLL */

function scrollToBottom() {

  setTimeout(
    function() {

      const chatArea =
        document.querySelector(
          ".chat-area"
        );


      chatArea.scrollTop =
        chatArea.scrollHeight;

    },
    50
  );

}


/* BACK */

function goBack() {

  window.location.href =
    "dashboard.html";

}


/* CLEANUP */

window.addEventListener(
  "beforeunload",
  function() {

    if (realtimeChannel) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

  }
);


</script>

</body>

</html>
