<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Chat - Personal Chatbot Partner</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    background:
        radial-gradient(circle at 10% 10%, rgba(124,58,237,0.20), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(37,99,235,0.18), transparent 30%),
        #070b18;
}

/* Main application */

.app {
    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;
}

/* Header */

.header {
    height: 70px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid rgba(255,255,255,0.08);

    background: rgba(9,14,30,0.88);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.character-info {
    display: flex;
    align-items: center;
    gap: 12px;

    min-width: 0;
}

.avatar {
    width: 44px;
    height: 44px;
    flex-shrink: 0;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #8b5cf6, #3b82f6);

    font-size: 21px;

    box-shadow:
        0 7px 22px rgba(99,102,241,0.25);
}

.info {
    min-width: 0;
}

.name {
    font-size: 15px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status {
    margin-top: 4px;

    display: flex;
    align-items: center;
    gap: 5px;

    color: #8f9bb5;

    font-size: 11px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #22c55e;

    box-shadow:
        0 0 8px rgba(34,197,94,0.65);
}

.back-button {
    flex-shrink: 0;

    width: 40px;
    height: 40px;

    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;

    background: rgba(255,255,255,0.05);

    color: #cbd5e1;

    font-size: 18px;

    cursor: pointer;
}

.back-button:hover {
    background: rgba(255,255,255,0.09);
}

/* Messages */

.messages {
    flex: 1;

    width: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 22px 18px 20px;

    scroll-behavior: smooth;
}

.messages::-webkit-scrollbar {
    width: 5px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}

.messages::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
}

.message-row {
    width: 100%;

    display: flex;

    margin-bottom: 13px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.other {
    justify-content: flex-start;
}

.bubble {
    max-width: min(70%, 620px);

    padding: 11px 14px;

    border-radius: 17px;

    font-size: 14px;
    line-height: 1.5;

    word-wrap: break-word;
    overflow-wrap: anywhere;

    white-space: pre-wrap;
}

.user .bubble {
    border-bottom-right-radius: 5px;

    background:
        linear-gradient(135deg, #7c3aed, #6366f1);

    color: white;

    box-shadow:
        0 7px 22px rgba(99,102,241,0.17);
}

.other .bubble {
    border-bottom-left-radius: 5px;

    border: 1px solid rgba(255,255,255,0.07);

    background: rgba(255,255,255,0.065);

    color: #e2e8f0;
}

.time {
    margin-top: 4px;

    font-size: 9px;

    color: rgba(255,255,255,0.42);

    text-align: right;
}

/* Empty state */

.empty {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: #74819c;
}

.empty-content {
    max-width: 280px;
}

.empty-icon {
    width: 58px;
    height: 58px;

    margin: 0 auto 15px;

    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(139,92,246,0.12);

    font-size: 25px;
}

.empty-title {
    color: #cbd5e1;

    font-size: 15px;
    font-weight: 700;

    margin-bottom: 6px;
}

.empty-text {
    font-size: 12px;
    line-height: 1.5;
}

/* Typing/loading */

.loading {
    text-align: center;

    padding: 15px;

    color: #69758e;

    font-size: 12px;
}

/* Composer */

.composer {
    flex-shrink: 0;

    padding: 12px 18px;

    border-top: 1px solid rgba(255,255,255,0.08);

    background: rgba(9,14,30,0.92);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.form {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    display: flex;
    align-items: flex-end;

    gap: 9px;
}

.message-input {
    flex: 1;

    min-width: 0;

    min-height: 46px;
    max-height: 120px;

    padding: 13px 15px;

    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 15px;

    outline: none;

    resize: none;

    background: rgba(255,255,255,0.055);

    color: white;

    font-family: Arial, sans-serif;
    font-size: 14px;

    line-height: 1.4;
}

.message-input::placeholder {
    color: #69758e;
}

.message-input:focus {
    border-color: rgba(139,92,246,0.7);

    background: rgba(255,255,255,0.07);

    box-shadow:
        0 0 0 3px rgba(139,92,246,0.08);
}

.send-button {
    width: 46px;
    height: 46px;

    flex-shrink: 0;

    border: none;
    border-radius: 14px;

    background: linear-gradient(135deg, #8b5cf6, #6366f1);

    color: white;

    font-size: 18px;

    cursor: pointer;

    box-shadow:
        0 8px 22px rgba(99,102,241,0.22);
}

.send-button:hover {
    transform: translateY(-1px);
}

.send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.error {
    padding: 8px 18px;

    text-align: center;

    color: #fca5a5;

    font-size: 12px;
}

/* Tablet */

@media (max-width: 700px) {

    .header {
        height: 64px;

        padding: 0 14px;
    }

    .avatar {
        width: 40px;
        height: 40px;

        border-radius: 12px;
    }

    .messages {
        padding: 17px 13px;
    }

    .bubble {
        max-width: 82%;

        font-size: 14px;
    }

    .composer {
        padding: 10px 12px;
    }
}

/* Phone */

@media (max-width: 480px) {

    .header {
        height: 60px;

        padding:
            0
            max(12px, env(safe-area-inset-right))
            0
            max(12px, env(safe-area-inset-left));
    }

    .name {
        max-width: 180px;
    }

    .status {
        font-size: 10px;
    }

    .messages {
        padding:
            15px
            10px
            14px;
    }

    .message-row {
        margin-bottom: 10px;
    }

    .bubble {
        max-width: 86%;

        padding: 10px 12px;

        border-radius: 15px;

        font-size: 13px;
    }

    .composer {
        padding:
            8px
            max(10px, env(safe-area-inset-right))
            calc(8px + env(safe-area-inset-bottom))
            max(10px, env(safe-area-inset-left));
    }

    .message-input {
        min-height: 44px;

        padding: 12px 13px;

        border-radius: 14px;

        font-size: 14px;
    }

    .send-button {
        width: 44px;
        height: 44px;

        border-radius: 13px;
    }
}

/* Very small phones */

@media (max-width: 360px) {

    .avatar {
        width: 37px;
        height: 37px;

        font-size: 18px;
    }

    .name {
        max-width: 145px;

        font-size: 14px;
    }

    .bubble {
        max-width: 89%;

        font-size: 13px;
    }
}
</style>

</head>

<body>

<div class="app">

```
<header class="header">

    <div class="character-info">

        <div class="avatar" id="avatar">
            ✦
        </div>

        <div class="info">

            <div class="name" id="characterName">
                Chat
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>Chat active</span>
            </div>

        </div>

    </div>

    <button
        class="back-button"
        id="backButton"
        aria-label="Back"
    >
        ←
    </button>

</header>

<main
    class="messages"
    id="messages"
>

    <div class="loading" id="loading">
        Loading chat...
    </div>

</main>

<div
    class="error"
    id="error"
    style="display:none;"
></div>

<footer class="composer">

    <form
        class="form"
        id="messageForm"
    >

        <textarea
            class="message-input"
            id="messageInput"
            placeholder="Type a message..."
            rows="1"
            autocomplete="off"
        ></textarea>

        <button
            class="send-button"
            id="sendButton"
            type="submit"
            aria-label="Send message"
        >
            ➤
        </button>

    </form>

</footer>
```

</div>

<script>

const SUPABASE_URL =
"https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let character = null;
let conversation = null;
let realtimeChannel = null;

const params =
new URLSearchParams(window.location.search);

const characterId =
params.get("id");

/* -------------------------
   Elements
------------------------- */

const messagesElement =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const errorElement =
document.getElementById("error");

const loadingElement =
document.getElementById("loading");

/* -------------------------
   Error
------------------------- */

function showError(text) {

    errorElement.textContent = text;
    errorElement.style.display = "block";
}

/* -------------------------
   Character display
------------------------- */

function getCharacterName(character) {

    if (
        character.character_type === "Other" &&
        character.custom_character
    ) {
        return character.custom_character;
    }

    return character.character_type;
}

function getCharacterIcon(type) {

    const icons = {
        "Father": "👨‍👧",
        "Mother": "👩‍👧",
        "Boyfriend": "👤",
        "Girlfriend": "👤",
        "Male Teacher": "👨‍🏫",
        "Female Teacher": "👩‍🏫",
        "Other": "✨"
    };

    return icons[type] || "✦";
}

/* -------------------------
   Authentication
------------------------- */

async function checkUser() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        window.location.replace("index.html");

        return false;
    }

    currentUser = session.user;

    const {
        data: profile,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select("status, role")
        .eq("id", currentUser.id)
        .single();

    if (
        error ||
        !profile ||
        profile.status !== "approved"
    ) {

        await supabaseClient.auth.signOut();

        window.location.replace("index.html");

        return false;
    }

    return true;
}

/* -------------------------
   Load character
------------------------- */

async function loadCharacter() {

    const {
        data,
        error
    } =
        await supabaseClient
        .from("characters")
        .select("*")
        .eq("id", characterId)
        .eq("user_id", currentUser.id)
        .single();

    if (error || !data) {

        showError("Chat character not found.");

        return false;
    }

    character = data;

    const name =
        getCharacterName(character);

    document.getElementById(
        "characterName"
    ).textContent = name;

    document.getElementById(
        "avatar"
    ).textContent =
        getCharacterIcon(character.character_type);

    return true;
}

/* -------------------------
   Find or create conversation
------------------------- */

async function loadConversation() {

    const {
        data: existing,
        error: findError
    } =
        await supabaseClient
        .from("conversations")
        .select("*")
        .eq("user_id", currentUser.id)
        .eq("character_id", character.id)
        .limit(1);

    if (findError) {

        showError(findError.message);

        return false;
    }

    if (existing && existing.length > 0) {

        conversation = existing[0];

        return true;
    }

    const {
        data: created,
        error: createError
    } =
        await supabaseClient
        .from("conversations")
        .insert({
            user_id: currentUser.id,
            character_id: character.id
        })
        .select()
        .single();

    if (createError) {

        showError(createError.message);

        return false;
    }

    conversation = created;

    return true;
}

/* -------------------------
   Load messages
------------------------- */

async function loadMessages() {

    const {
        data,
        error
    } =
        await supabaseClient
        .from("messages")
        .select("*")
        .eq("conversation_id", conversation.id)
        .order("created_at", {
            ascending: true
        });

    if (error) {

        showError(error.message);

        return;
    }

    messagesElement.innerHTML = "";

    if (!data || data.length === 0) {

        showEmpty();

        return;
    }

    data.forEach(message => {

        addMessage(
            message,
            false
        );

    });

    scrollToBottom();
}

/* -------------------------
   Empty state
------------------------- */

function showEmpty() {

    messagesElement.innerHTML = `
        <div class="empty">
            <div class="empty-content">

                <div class="empty-icon">
                    💬
                </div>

                <div class="empty-title">
                    Start the conversation
                </div>

                <div class="empty-text">
                    Send a message below to begin your chat.
                </div>

            </div>
        </div>
    `;
}

/* -------------------------
   Add message
------------------------- */

function addMessage(message, scroll = true) {

    const empty =
        messagesElement.querySelector(".empty");

    if (empty) {
        empty.remove();
    }

    const isUser =
        message.sender_id === currentUser.id;

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (isUser ? "user" : "other");

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    const content =
        document.createElement("div");

    content.textContent =
        message.content;

    bubble.appendChild(content);

    if (message.created_at) {

        const time =
            document.createElement("div");

        time.className = "time";

        time.textContent =
            formatTime(message.created_at);

        bubble.appendChild(time);
    }

    row.appendChild(bubble);

    messagesElement.appendChild(row);

    if (scroll) {
        scrollToBottom();
    }
}

/* -------------------------
   Time
------------------------- */

function formatTime(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );
}

/* -------------------------
   Scroll
------------------------- */

function scrollToBottom() {

    requestAnimationFrame(() => {

        messagesElement.scrollTop =
            messagesElement.scrollHeight;

    });
}

/* -------------------------
   Send message
------------------------- */

document
.getElementById("messageForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const content =
            messageInput.value.trim();

        if (!content || !conversation) {
            return;
        }

        sendButton.disabled = true;

        const {
            error
        } =
            await supabaseClient
            .from("messages")
            .insert({
                conversation_id:
                    conversation.id,

                sender_id:
                    currentUser.id,

                content:
                    content
            });

        if (error) {

            showError(error.message);

        } else {

            messageInput.value = "";

            resizeInput();

        }

        sendButton.disabled = false;

        messageInput.focus();
    }
);

/* -------------------------
   Auto resize textarea
------------------------- */

function resizeInput() {

    messageInput.style.height = "auto";

    const height =
        Math.min(
            messageInput.scrollHeight,
            120
        );

    messageInput.style.height =
        height + "px";
}

messageInput.addEventListener(
    "input",
    resizeInput
);

/* -------------------------
   Enter to send
------------------------- */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            document
            .getElementById("messageForm")
            .requestSubmit();
        }

    }
);

/* -------------------------
   Realtime
------------------------- */

function startRealtime() {

    if (realtimeChannel) {

        supabaseClient
        .removeChannel(realtimeChannel);

    }

    realtimeChannel =
        supabaseClient
        .channel(
            "chat-" + conversation.id
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages",
                filter:
                    "conversation_id=eq." +
                    conversation.id
            },
            payload => {

                const incoming =
                    payload.new;

                /*
                 Prevent duplicates if the
                 message is already displayed.
                */

                const existingMessages =
                    messagesElement
                    .querySelectorAll(".bubble");

                let duplicate = false;

                existingMessages.forEach(
                    bubble => {

                        if (
                            bubble.dataset &&
                            bubble.dataset.id ===
                            incoming.id
                        ) {
                            duplicate = true;
                        }

                    }
                );

                if (!duplicate) {

                    addMessage(
                        incoming,
                        true
                    );

                }

            }
        )
        .subscribe(
            status => {

                console.log(
                    "Chat realtime:",
                    status
                );

            }
        );
}

/* -------------------------
   Back button
------------------------- */

document
.getElementById("backButton")
.addEventListener(
    "click",
    async function() {

        if (realtimeChannel) {

            await supabaseClient
            .removeChannel(
                realtimeChannel
            );

        }

        window.location.href =
            "dashboard.html";
    }
);

/* -------------------------
   Auth state
------------------------- */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        if (
            event === "SIGNED_OUT" ||
            !session
        ) {

            window.location.replace(
                "index.html"
            );

        }

    }
);

/* -------------------------
   Initialize
------------------------- */

async function initialize() {

    if (!characterId) {

        window.location.replace(
            "dashboard.html"
        );

        return;
    }

    const authenticated =
        await checkUser();

    if (!authenticated) {
        return;
    }

    const characterLoaded =
        await loadCharacter();

    if (!characterLoaded) {
        return;
    }

    const conversationLoaded =
        await loadConversation();

    if (!conversationLoaded) {
        return;
    }

    await loadMessages();

    loadingElement?.remove();

    startRealtime();

    messageInput.focus();
}

initialize();

</script>
