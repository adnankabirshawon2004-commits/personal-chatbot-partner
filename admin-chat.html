<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;
let selectedUser = null;
let selectedCharacter = null;
let conversationId = null;
let realtimeChannel = null;
let selectedImage = null;

/* NEW: selected message for reply */
let replyingToMessage = null;


/* =========================
   INIT
========================= */

async function init(){

  try{

    const {
      data:{
        user
      }
    } =
      await supabaseClient.auth.getUser();

    if(!user){

      window.location.href =
        "index.html";

      return;
    }

    currentUser = user;


    const {
      data:profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .single();


    if(error){

      console.error(error);

      alert(
        "Could not load admin profile."
      );

      return;
    }


    if(
      profile.role !== "admin" ||
      profile.status !== "approved"
    ){

      alert("Access denied.");

      window.location.href =
        "dashboard.html";

      return;
    }


    await loadUsers();


    const params =
      new URLSearchParams(
        window.location.search
      );

    const userId =
      params.get("user");

    const characterId =
      params.get("character");


    if(userId){

      await selectUser(
        userId,
        characterId
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "Something went wrong."
    );

  }

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

  const container =
    document.getElementById("users");

  container.innerHTML = "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("role","user")
      .eq("status","approved")
      .order("created_at",{
        ascending:false
      });


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty-sidebar">
        Could not load users.
      </div>
    `;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML = `
      <div class="empty-sidebar">
        No approved users.
      </div>
    `;

    return;
  }


  for(const user of data){

    await createUserSection(
      user,
      container
    );

  }

}


/* =========================
   USER SECTION
========================= */

async function createUserSection(
  user,
  container
){

  const section =
    document.createElement("div");

  section.className =
    "user-section";


  const header =
    document.createElement("div");

  header.className =
    "user-header";


  const firstLetter =
    (
      user.name ||
      user.email ||
      "U"
    )
      .charAt(0)
      .toUpperCase();


  header.innerHTML = `

    <div class="user-avatar">
      ${escapeHtml(firstLetter)}
    </div>

    <div class="user-info">

      <div class="user-name">
        ${escapeHtml(
          user.name ||
          "Unnamed User"
        )}
      </div>

      <div class="user-email">
        ${escapeHtml(
          user.email || ""
        )}
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  `;


  const characters =
    document.createElement("div");

  characters.className =
    "characters";


  header.addEventListener(
    "click",
    async() => {

      const isOpen =
        characters.classList.contains(
          "open"
        );


      document
        .querySelectorAll(
          ".characters.open"
        )
        .forEach(el => {

          if(el !== characters){

            el.classList.remove(
              "open"
            );

          }

        });


      document
        .querySelectorAll(
          ".arrow.open"
        )
        .forEach(el => {

          if(
            el !==
            header.querySelector(
              ".arrow"
            )
          ){

            el.classList.remove(
              "open"
            );

          }

        });


      characters.classList.toggle(
        "open"
      );

      header
        .querySelector(".arrow")
        .classList.toggle(
          "open"
        );


      if(
        characters.dataset.loaded !==
        "true"
      ){

        await loadCharacters(
          user.id,
          characters
        );

        characters.dataset.loaded =
          "true";

      }

    }
  );


  section.appendChild(header);

  section.appendChild(characters);

  container.appendChild(section);

}


/* =========================
   LOAD CHARACTERS
========================= */

async function loadCharacters(
  userId,
  container
){

  container.innerHTML = `
    <div class="empty-sidebar">
      Loading characters...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("characters")
      .select("*")
      .eq("user_id",userId)
      .order("created_at",{
        ascending:false
      });


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty-sidebar">
        Could not load characters.
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  if(!data || data.length === 0){

    container.innerHTML = `
      <div class="empty-sidebar">
        No characters.
      </div>
    `;

    return;
  }


  data.forEach(character => {

    container.appendChild(
      createCharacterItem(
        character
      )
    );

  });

}


/* =========================
   CHARACTER ITEM
========================= */

function createCharacterItem(
  character
){

  const item =
    document.createElement("div");

  item.className =
    "character-item";


  const avatar =
    document.createElement("img");

  avatar.className =
    "character-avatar";

  avatar.alt =
    character.custom_character ||
    character.character_type ||
    "Character";

  avatar.src =
    getDefaultAvatar();


  if(character.avatar_url){

    createSignedUrl(
      "character-avatars",
      character.avatar_url
    ).then(url => {

      if(url){

        avatar.src = url;

      }

    });

  }


  const info =
    document.createElement("div");

  info.className =
    "character-info";


  const name =
    character.custom_character ||
    character.character_type ||
    "Character";


  info.innerHTML = `

    <div class="character-name">
      ${escapeHtml(name)}
    </div>

    <div class="character-type">
      ${escapeHtml(
        character.character_type || ""
      )}
    </div>

    <div class="character-mood">
      ${escapeHtml(
        character.chat_experience || ""
      )}
    </div>

  `;


  item.appendChild(avatar);

  item.appendChild(info);


  item.addEventListener(
    "click",
    async event => {

      event.stopPropagation();


      document
        .querySelectorAll(
          ".character-item.active"
        )
        .forEach(el => {

          el.classList.remove(
            "active"
          );

        });


      item.classList.add("active");


      await selectCharacter(
        character
      );

    }
  );


  return item;

}


/* =========================
   SELECT USER
========================= */

async function selectUser(
  userId,
  characterId = null
){

  const {
    data:user,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",userId)
      .single();


  if(error){

    console.error(error);

    return;
  }


  selectedUser = user;


  const sections =
    document.querySelectorAll(
      ".user-section"
    );


  for(const section of sections){

    const email =
      section
        .querySelector(".user-email")
        ?.textContent
        ?.trim();


    if(email === user.email){

      const characters =
        section.querySelector(
          ".characters"
        );

      const header =
        section.querySelector(
          ".user-header"
        );


      characters.classList.add(
        "open"
      );

      header
        .querySelector(".arrow")
        ?.classList.add("open");


      if(
        characters.dataset.loaded !==
        "true"
      ){

        await loadCharacters(
          userId,
          characters
        );

        characters.dataset.loaded =
          "true";

      }


      if(characterId){

        const {
          data:character
        } =
          await supabaseClient
            .from("characters")
            .select("*")
            .eq("id",characterId)
            .eq("user_id",userId)
            .maybeSingle();


        if(character){

          await selectCharacter(
            character
          );

          return;
        }

      }


      const {
        data:charactersData
      } =
        await supabaseClient
          .from("characters")
          .select("*")
          .eq("user_id",userId)
          .order("created_at",{
            ascending:false
          })
          .limit(1);


      if(
        charactersData &&
        charactersData.length
      ){

        await selectCharacter(
          charactersData[0]
        );

      }

      return;
    }

  }

}


/* =========================
   SELECT CHARACTER
========================= */

async function selectCharacter(
  character
){

  selectedCharacter =
    character;


  if(!selectedUser){

    const {
      data:user
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",character.user_id)
        .single();

    selectedUser =
      user;

  }


  const name =
    character.custom_character ||
    character.character_type ||
    "Character";


  document.getElementById(
    "headerName"
  ).textContent =
    name;


  document.getElementById(
    "headerUser"
  ).textContent =
    selectedUser
      ? (
          selectedUser.name ||
          selectedUser.email ||
          "User"
        )
      : "User";


  document.getElementById(
    "headerMood"
  ).textContent =
    character.chat_experience
      ? `Mood: ${character.chat_experience}`
      : "";


  const headerAvatar =
    document.getElementById(
      "headerAvatar"
    );


  headerAvatar.src =
    getDefaultAvatar();

  headerAvatar.style.display =
    "block";


  if(character.avatar_url){

    const url =
      await createSignedUrl(
        "character-avatars",
        character.avatar_url
      );

    if(url){

      headerAvatar.src =
        url;

    }

  }


  cancelReply();

  await loadConversation(
    character
  );

}


/* =========================
   LOAD CONVERSATION
========================= */

async function loadConversation(
  character
){

  stopRealtime();

  conversationId =
    null;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user_id",character.user_id)
      .eq("character_id",character.id)
      .order("created_at",{
        ascending:false
      })
      .limit(1);


  if(error){

    console.error(error);

    showEmpty(
      "Could not load conversation."
    );

    return;
  }


  if(!data || data.length === 0){

    showEmpty(
      "No conversation yet."
    );

    return;
  }


  conversationId =
    data[0].id;


  await loadMessages();

  startRealtime();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!conversationId){

    showEmpty(
      "No conversation yet."
    );

    return;
  }


  const messages =
    document.getElementById(
      "messages"
    );

  messages.innerHTML = "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        conversationId
      )
      .order("created_at",{
        ascending:true
      });


  if(error){

    console.error(error);

    showEmpty(
      "Could not load messages."
    );

    return;
  }


  if(!data || data.length === 0){

    showEmpty(
      "No messages yet."
    );

    return;
  }


  for(const message of data){

    await addMessage(
      message,
      data
    );

  }


  scrollBottom();

}


/* =========================
   ADD MESSAGE
========================= */

async function addMessage(
  message,
  allMessages = []
){

  const messages =
    document.getElementById(
      "messages"
    );


  const empty =
    messages.querySelector(
      ".empty-chat"
    );

  if(empty){

    empty.remove();

  }


  const isAdmin =
    message.sender_id ===
    currentUser.id;


  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (
      isAdmin
        ? "admin"
        : "user"
    );


  row.dataset.messageId =
    message.id;


  const bubble =
    document.createElement("div");

  bubble.className =
    "message";


  /* =========================
     REPLIED MESSAGE
  ========================= */

  if(message.reply_to){

    let repliedMessage = null;


    if(allMessages.length){

      repliedMessage =
        allMessages.find(
          m =>
            m.id ===
            message.reply_to
        );

    }


    if(!repliedMessage){

      const {
        data
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .eq(
            "id",
            message.reply_to
          )
          .maybeSingle();

      repliedMessage =
        data;

    }


    if(repliedMessage){

      const replyBox =
        document.createElement("div");

      replyBox.className =
        "reply-preview";


      const replyLabel =
        document.createElement("div");

      replyLabel.className =
        "reply-label";

      replyLabel.textContent =
        repliedMessage.sender_id ===
        currentUser.id
          ? "You"
          : "User";


      const replyText =
        document.createElement("div");

      replyText.className =
        "reply-text";


      if(repliedMessage.content){

        replyText.textContent =
          repliedMessage.content;

      }else if(
        repliedMessage.image_path
      ){

        replyText.textContent =
          "📷 Image";

      }else{

        replyText.textContent =
          "Message";

      }


      replyBox.appendChild(
        replyLabel
      );

      replyBox.appendChild(
        replyText
      );


      replyBox.onclick =
        () => {

          const target =
            document.querySelector(
              `[data-message-id="${repliedMessage.id}"]`
            );


          if(target){

            target.scrollIntoView({
              behavior:"smooth",
              block:"center"
            });

          }

        };


      bubble.appendChild(
        replyBox
      );

    }

  }


  /* IMAGE */

  if(message.image_path){

    const imageUrl =
      await createSignedUrl(
        "chat-images",
        message.image_path
      );


    if(imageUrl){

      const img =
        document.createElement("img");

      img.className =
        "message-image";

      img.src =
        imageUrl;

      img.alt =
        message.image_name ||
        "Image";


      img.onclick =
        () => {

          window.open(
            imageUrl,
            "_blank"
          );

        };


      bubble.appendChild(img);

    }

  }


  /* TEXT */

  if(message.content){

    const text =
      document.createElement("div");

    text.className =
      "message-text";

    text.textContent =
      message.content;

    bubble.appendChild(text);

  }


  /* =========================
     REPLY BUTTON
  ========================= */

  const actions =
    document.createElement("div");

  actions.className =
    "message-actions";


  const replyButton =
    document.createElement("button");

  replyButton.className =
    "reply-button";

  replyButton.type =
    "button";

  replyButton.textContent =
    "↩ Reply";


  replyButton.onclick =
    () => {

      startReply(
        message
      );

    };


  actions.appendChild(
    replyButton
  );

  bubble.appendChild(
    actions
  );


  /* TIME */

  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      message.created_at
    );


  bubble.appendChild(
    time
  );


  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

}


/* =========================
   START REPLY
========================= */

function startReply(
  message
){

  replyingToMessage =
    message;


  const replyComposer =
    document.getElementById(
      "replyComposer"
    );


  const replyText =
    document.getElementById(
      "replyComposerText"
    );


  let preview =
    "";


  if(message.content){

    preview =
      message.content;

  }else if(
    message.image_path
  ){

    preview =
      "📷 Image";

  }else{

    preview =
      "Message";

  }


  replyText.textContent =
    preview;


  replyComposer.classList.add(
    "show"
  );


  const input =
    document.getElementById(
      "messageInput"
    );


  input.focus();

}


/* =========================
   CANCEL REPLY
========================= */

function cancelReply(){

  replyingToMessage =
    null;


  const replyComposer =
    document.getElementById(
      "replyComposer"
    );


  replyComposer.classList.remove(
    "show"
  );


  const replyText =
    document.getElementById(
      "replyComposerText"
    );


  replyText.textContent =
    "";

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(
    !selectedUser ||
    !selectedCharacter ||
    !conversationId
  ){

    alert(
      "Please select a character first."
    );

    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const content =
    input.value.trim();


  if(
    !content &&
    !selectedImage
  ){

    return;
  }


  const sendButton =
    document.getElementById(
      "sendButton"
    );


  const imageButton =
    document.getElementById(
      "imageButton"
    );


  sendButton.disabled =
    true;

  imageButton.disabled =
    true;


  try{

    let imagePath = null;
    let imageType = null;
    let imageName = null;


    /* IMAGE */

    if(selectedImage){

      const extension =
        selectedImage.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        `${selectedUser.id}/${conversationId}/${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from("chat-images")
          .upload(
            fileName,
            selectedImage,
            {
              contentType:
                selectedImage.type,
              upsert:false
            }
          );


      if(error){

        throw error;

      }


      imagePath =
        fileName;

      imageType =
        selectedImage.type;

      imageName =
        selectedImage.name;

    }


    /* =========================
       MESSAGE DATA
    ========================= */

    const messageData = {

      conversation_id:
        conversationId,

      sender_id:
        currentUser.id,

      content:
        content,

      image_path:
        imagePath,

      image_type:
        imageType,

      image_name:
        imageName

    };


    /* ADD REPLY */

    if(replyingToMessage){

      messageData.reply_to =
        replyingToMessage.id;

    }


    /* INSERT */

    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert(
          messageData
        );


    if(error){

      throw error;

    }


    /* CLEAR */

    input.value =
      "";

    input.style.height =
      "42px";


    removeImage();

    cancelReply();


  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );

    alert(
      "Could not send message."
    );

  }finally{

    sendButton.disabled =
      false;

    imageButton.disabled =
      false;

    input.focus();

  }

}


/* =========================
   ENTER TO SEND
========================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   IMAGE INPUT
========================= */

document
  .getElementById(
    "imageInput"
  )
  .addEventListener(
    "change",
    function(event){

      const file =
        event.target.files[0];


      if(!file){

        return;

      }


      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        alert(
          "Please select an image."
        );

        event.target.value =
          "";

        return;

      }


      if(
        file.size >
        5 * 1024 * 1024
      ){

        alert(
          "Image must be smaller than 5 MB."
        );

        event.target.value =
          "";

        return;

      }


      selectedImage =
        file;


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          document.getElementById(
            "previewImage"
          ).src =
            e.target.result;


          document.getElementById(
            "imagePreview"
          ).classList.add(
            "show"
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );


/* =========================
   REMOVE IMAGE
========================= */

function removeImage(){

  selectedImage =
    null;


  document.getElementById(
    "imageInput"
  ).value =
    "";


  document.getElementById(
    "previewImage"
  ).src =
    "";


  document.getElementById(
    "imagePreview"
  ).classList.remove(
    "show"
  );

}


/* =========================
   REALTIME
========================= */

function startRealtime(){

  if(!conversationId){

    return;

  }


  stopRealtime();


  realtimeChannel =
    supabaseClient
      .channel(
        "admin-chat-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `conversation_id=eq.${conversationId}`
        },
        async payload => {

          console.log(
            "REALTIME MESSAGE:",
            payload.new
          );


          await addMessage(
            payload.new,
            []
          );

        }
      )
      .subscribe(
        status => {

          console.log(
            "ADMIN REALTIME:",
            status
          );

        }
      );

}


/* =========================
   STOP REALTIME
========================= */

function stopRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;

  }

}


/* =========================
   SIGNED URL
========================= */

async function createSignedUrl(
  bucket,
  path
){

  if(!path){

    return null;

  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(bucket)
        .createSignedUrl(
          path,
          60 * 60
        );


    if(error){

      console.error(
        "SIGNED URL ERROR:",
        error
      );

      return null;

    }


    return data?.signedUrl ||
      null;

  }catch(error){

    console.error(error);

    return null;

  }

}


/* =========================
   DEFAULT AVATAR
========================= */

  return `
    data:image/svg+xml;charset=UTF-8,
    ${encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
        viewBox="0 0 100 100"
      >
        <rect
          width="100"
          height="100"
          rx="50"
          fill="#202637"
        />
        <circle
          cx="50"
          cy="38"
          r="17"
          fill="#8b93a5"
        />
        <path
          d="M20 85c4-20 16-29 30-29s26 9 30 29"
          fill="#8b93a5"
        />
      </svg>
    `)}
  `;

}


/* =========================
   EMPTY
========================= */

function showEmpty(text){

  document.getElementById(
    "messages"
  ).innerHTML = `

    <div class="empty-chat">

      <h3>
        ${escapeHtml(text)}
      </h3>

    </div>

  `;

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  setTimeout(() => {

    const messages =
      document.getElementById(
        "messages"
      );

    messages.scrollTop =
      messages.scrollHeight;

  },50);

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(value){

  if(!value){

    return "";

  }


  return new Date(value)
    .toLocaleString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


/* =========================
   AUTO RESIZE
========================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "input",
    function(){

      this.style.height =
        "42px";

      this.style.height =
        Math.min(
          this.scrollHeight,
          130
        ) + "px";

    }
  );


/* =========================
   BEFORE UNLOAD
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopRealtime();

  }
);


/* =========================
   START
========================= */

init();

</script>
