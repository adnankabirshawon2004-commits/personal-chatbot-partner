<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      background:#080b12;
      color:#fff;
      height:100vh;
      overflow:hidden;
    }

    button,
    textarea{
      font-family:inherit;
    }

    .app{
      display:flex;
      height:100vh;
      width:100%;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar{
      width:330px;
      background:rgba(15,18,28,.96);
      border-right:1px solid rgba(255,255,255,.08);
      display:flex;
      flex-direction:column;
      flex-shrink:0;
    }

    .sidebar-header{
      padding:20px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .sidebar-header h2{
      font-size:21px;
      margin-bottom:5px;
    }

    .sidebar-header p{
      color:#8e96a8;
      font-size:13px;
    }

    .users{
      flex:1;
      overflow-y:auto;
      padding:12px;
    }

    .user-section{
      margin-bottom:10px;
    }

    .user-header{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px;
      border-radius:12px;
      cursor:pointer;
      background:rgba(255,255,255,.035);
      transition:.2s;
    }

    .user-header:hover{
      background:rgba(255,255,255,.07);
    }

    .user-avatar{
      width:40px;
      height:40px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      font-weight:bold;
      flex-shrink:0;
    }

    .user-info{
      min-width:0;
      flex:1;
    }

    .user-name{
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .user-email{
      font-size:11px;
      color:#7f8798;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .arrow{
      color:#8d95a7;
      transition:.2s;
    }

    .arrow.open{
      transform:rotate(90deg);
    }

    .characters{
      display:none;
      padding:5px 0 5px 15px;
    }

    .characters.open{
      display:block;
    }

    .character-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      margin:3px 0;
      border-radius:10px;
      cursor:pointer;
      transition:.2s;
    }

    .character-item:hover{
      background:rgba(255,255,255,.05);
    }

    .character-item.active{
      background:rgba(99,102,241,.18);
      border:1px solid rgba(99,102,241,.3);
    }

    .character-avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      object-fit:cover;
      background:#222735;
      flex-shrink:0;
    }

    .character-info{
      min-width:0;
    }

    .character-name{
      font-size:14px;
      font-weight:600;
    }

    .character-type{
      font-size:11px;
      color:#8e96a8;
      margin-top:2px;
    }

    .character-mood{
      font-size:10px;
      color:#a78bfa;
      margin-top:3px;
    }

    .empty-sidebar{
      color:#777f91;
      font-size:13px;
      padding:20px;
      text-align:center;
    }

    /* =========================
       CHAT AREA
    ========================= */

    .chat-area{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      background:
        radial-gradient(circle at top right,rgba(99,102,241,.08),transparent 35%),
        #080b12;
    }

    .chat-header{
      min-height:75px;
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      gap:12px;
      background:rgba(10,13,21,.85);
    }

    .header-avatar{
      width:48px;
      height:48px;
      border-radius:50%;
      object-fit:cover;
      background:#222735;
    }

    .header-info{
      min-width:0;
    }

    .header-name{
      font-size:17px;
      font-weight:700;
    }

    .header-user{
      color:#8b93a5;
      font-size:12px;
      margin-top:3px;
    }

    .header-mood{
      color:#a78bfa;
      font-size:11px;
      margin-top:3px;
    }

    .messages{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .empty-chat{
      margin:auto;
      text-align:center;
      color:#6f7788;
    }

    .empty-chat h3{
      color:#9ca3b5;
      margin-bottom:5px;
    }

    .message-row{
      display:flex;
      width:100%;
    }

    .message-row.admin{
      justify-content:flex-end;
    }

    .message-row.user{
      justify-content:flex-start;
    }

    .message{
      max-width:min(75%,600px);
      padding:10px 13px;
      border-radius:15px;
      background:#171c28;
      border:1px solid rgba(255,255,255,.06);
    }

    .message-row.admin .message{
      background:linear-gradient(135deg,#4f46e5,#6366f1);
      border:none;
      border-bottom-right-radius:4px;
    }

    .message-row.user .message{
      border-bottom-left-radius:4px;
    }

    .message-text{
      font-size:14px;
      line-height:1.5;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .message-image{
      display:block;
      max-width:300px;
      max-height:350px;
      border-radius:10px;
      margin-bottom:7px;
      object-fit:contain;
      cursor:pointer;
    }

    .message-time{
      font-size:10px;
      opacity:.6;
      margin-top:5px;
      text-align:right;
    }

    /* =========================
       IMAGE PREVIEW
    ========================= */

    .image-preview{
      display:none;
      padding:10px 20px 0;
    }

    .image-preview.show{
      display:block;
    }

    .preview-box{
      position:relative;
      display:inline-block;
    }

    .preview-box img{
      width:100px;
      height:100px;
      object-fit:cover;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.15);
    }

    .remove-image{
      position:absolute;
      top:-7px;
      right:-7px;
      width:23px;
      height:23px;
      border:none;
      border-radius:50%;
      background:#ef4444;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer{
      padding:12px 20px 18px;
      border-top:1px solid rgba(255,255,255,.08);
      background:rgba(10,13,21,.92);
    }

    .composer-box{
      display:flex;
      align-items:flex-end;
      gap:8px;
      background:#141925;
      border:1px solid rgba(255,255,255,.09);
      border-radius:15px;
      padding:7px;
    }

    .icon-button{
      width:42px;
      height:42px;
      border:none;
      border-radius:11px;
      background:#202637;
      color:#dbe1ef;
      cursor:pointer;
      font-size:19px;
      flex-shrink:0;
    }

    .icon-button:hover{
      background:#293147;
    }

    textarea{
      flex:1;
      resize:none;
      min-height:42px;
      max-height:130px;
      padding:11px 8px;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:14px;
      line-height:20px;
    }

    textarea::placeholder{
      color:#697184;
    }

    .send-button{
      height:42px;
      padding:0 18px;
      border:none;
      border-radius:11px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      flex-shrink:0;
    }

    .send-button:hover{
      opacity:.9;
    }

    .send-button:disabled,
    .icon-button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .composer-help{
      font-size:10px;
      color:#646c7e;
      margin-top:7px;
      text-align:center;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:750px){

      .sidebar{
        width:260px;
      }

      .message{
        max-width:88%;
      }

      .messages{
        padding:14px;
      }

      .composer{
        padding:10px;
      }

      .image-preview{
        padding:8px 10px 0;
      }

      .chat-header{
        padding:10px 12px;
      }

      .header-name{
        font-size:15px;
      }

      .header-user{
        font-size:10px;
      }

      .send-button{
        padding:0 13px;
      }
    }

    @media(max-width:550px){

      .sidebar{
        width:220px;
      }

      .character-type{
        display:none;
      }

      .composer-help{
        display:none;
      }

      .icon-button{
        width:38px;
        height:38px;
      }

      .send-button{
        height:38px;
        padding:0 11px;
      }

      textarea{
        min-height:38px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside class="sidebar">

    <div class="sidebar-header">
      <h2>Admin Chat</h2>
      <p>All users & characters</p>
    </div>

    <div id="users" class="users">
      <div class="empty-sidebar">
        Loading users...
      </div>
    </div>

  </aside>


  <!-- =========================
       CHAT
  ========================= -->

  <main class="chat-area">

    <header class="chat-header">

      <img
        id="headerAvatar"
        class="header-avatar"
        src=""
        style="display:none;"
        alt=""
      >

      <div class="header-info">

        <div id="headerName" class="header-name">
          Select a character
        </div>

        <div id="headerUser" class="header-user">
          Choose a user and character from the left
        </div>

        <div id="headerMood" class="header-mood"></div>

      </div>

    </header>


    <div id="messages" class="messages">

      <div class="empty-chat">
        <h3>No conversation selected</h3>
        <p>Select a character to open the chat.</p>
      </div>

    </div>


    <!-- IMAGE PREVIEW -->

    <div id="imagePreview" class="image-preview">

      <div class="preview-box">

        <img id="previewImage" src="" alt="Preview">

        <button
          class="remove-image"
          onclick="removeImage()"
          type="button"
        >
          ×
        </button>

      </div>

    </div>


    <!-- COMPOSER -->

    <div class="composer">

      <div class="composer-box">

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          hidden
        >

        <button
          id="imageButton"
          class="icon-button"
          type="button"
          onclick="document.getElementById('imageInput').click()"
          title="Send image"
        >
          📷
        </button>

        <textarea
          id="messageInput"
          placeholder="Write a message..."
          rows="1"
        ></textarea>

        <button
          id="sendButton"
          class="send-button"
          type="button"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

      <div class="composer-help">
        Press Enter to send • Shift + Enter for new line
      </div>

    </div>

  </main>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;

let selectedUser = null;

let selectedCharacter = null;

let conversationId = null;

let realtimeChannel = null;

let selectedImage = null;


/* =========================
   INIT
========================= */

async function init(){

  try{

    const {
      data: {
        user
      }
    } = await supabaseClient.auth.getUser();

    if(!user){

      window.location.href = "index.html";

      return;

    }

    currentUser = user;


    /* Check admin profile */

    const {
      data: profile,
      error
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();


    if(error){

      console.error(error);

      alert("Could not load admin profile.");

      return;

    }


    if(
      profile.role !== "admin" ||
      profile.status !== "approved"
    ){

      alert("Access denied.");

      window.location.href = "dashboard.html";

      return;

    }


    await loadUsers();


    /* =========================
       OPEN URL CHARACTER
    ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const userId =
      params.get("user");

    const characterId =
      params.get("character");


    if(userId){

      await selectUser(
        userId,
        characterId
      );

    }

  }catch(error){

    console.error(error);

    alert("Something went wrong.");

  }

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

  const usersContainer =
    document.getElementById("users");

  usersContainer.innerHTML = "";


  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("role","user")
    .eq("status","approved")
    .order("created_at",{
      ascending:false
    });


  if(error){

    console.error(error);

    usersContainer.innerHTML = `
      <div class="empty-sidebar">
        Could not load users.
      </div>
    `;

    return;

  }


  if(!data || data.length === 0){

    usersContainer.innerHTML = `
      <div class="empty-sidebar">
        No approved users.
      </div>
    `;

    return;

  }


  for(const user of data){

    await createUserSection(
      user,
      usersContainer
    );

  }

}


/* =========================
   CREATE USER SECTION
========================= */

async function createUserSection(
  user,
  container
){

  const section =
    document.createElement("div");

  section.className =
    "user-section";


  const header =
    document.createElement("div");

  header.className =
    "user-header";


  const firstLetter =
    (user.name || user.email || "U")
      .charAt(0)
      .toUpperCase();


  header.innerHTML = `

    <div class="user-avatar">
      ${escapeHtml(firstLetter)}
    </div>

    <div class="user-info">

      <div class="user-name">
        ${escapeHtml(
          user.name || "Unnamed User"
        )}
      </div>

      <div class="user-email">
        ${escapeHtml(
          user.email || ""
        )}
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  `;


  const characters =
    document.createElement("div");

  characters.className =
    "characters";


  header.addEventListener(
    "click",
    async () => {

      const isOpen =
        characters.classList.contains("open");


      document
        .querySelectorAll(".characters.open")
        .forEach(el => {

          if(el !== characters){

            el.classList.remove("open");

          }

        });


      document
        .querySelectorAll(".arrow.open")
        .forEach(el => {

          if(
            el !== header.querySelector(".arrow")
          ){

            el.classList.remove("open");

          }

        });


      characters.classList.toggle("open");

      header
        .querySelector(".arrow")
        .classList.toggle("open");


      if(
        characters.dataset.loaded !== "true"
      ){

        await loadCharacters(
          user.id,
          characters
        );

        characters.dataset.loaded =
          "true";

      }

    }
  );


  section.appendChild(header);

  section.appendChild(characters);

  container.appendChild(section);

}


/* =========================
   LOAD ALL CHARACTERS
========================= */

async function loadCharacters(
  userId,
  container
){

  container.innerHTML = `
    <div class="empty-sidebar">
      Loading characters...
    </div>
  `;


  const {
    data,
    error
  } = await supabaseClient
    .from("characters")
    .select("*")
    .eq("user_id",userId)
    .order("created_at",{
      ascending:false
    });


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty-sidebar">
        Could not load characters.
      </div>
    `;

    return;

  }


  container.innerHTML = "";


  if(!data || data.length === 0){

    container.innerHTML = `
      <div class="empty-sidebar">
        No characters.
      </div>
    `;

    return;

  }


  data.forEach(character => {

    const item =
      createCharacterItem(
        character
      );

    container.appendChild(item);

  });

}


/* =========================
   CREATE CHARACTER ITEM
========================= */

function createCharacterItem(
  character
){

  const item =
    document.createElement("div");

  item.className =
    "character-item";


  const avatar =
    document.createElement("img");

  avatar.className =
    "character-avatar";


  avatar.alt =
    character.custom_character ||
    character.character_type ||
    "Character";


  avatar.src =
    getDefaultAvatar();


  if(character.avatar_url){

    createSignedUrl(
      "character-avatars",
      character.avatar_url
    ).then(url => {

      if(url){

        avatar.src = url;

      }

    });

  }


  const info =
    document.createElement("div");

  info.className =
    "character-info";


  const name =
    character.custom_character ||
    character.character_type ||
    "Character";


  info.innerHTML = `

    <div class="character-name">
      ${escapeHtml(name)}
    </div>

    <div class="character-type">
      ${escapeHtml(
        character.character_type || ""
      )}
    </div>

    <div class="character-mood">
      ${escapeHtml(
        character.chat_experience || ""
      )}
    </div>

  `;


  item.appendChild(avatar);

  item.appendChild(info);


  item.addEventListener(
    "click",
    async event => {

      event.stopPropagation();

      document
        .querySelectorAll(".character-item.active")
        .forEach(el => {

          el.classList.remove("active");

        });


      item.classList.add("active");


      await selectCharacter(
        character
      );

    }
  );


  return item;

}


/* =========================
   SELECT USER
========================= */

async function selectUser(
  userId,
  characterId = null
){

  selectedUser = null;


  const {
    data: user,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",userId)
    .single();


  if(error){

    console.error(error);

    return;

  }


  selectedUser = user;


  const userSections =
    document.querySelectorAll(
      ".user-section"
    );


  for(const section of userSections){

    const header =
      section.querySelector(
        ".user-header"
      );

    const characters =
      section.querySelector(
        ".characters"
      );


    if(
      header &&
      characters
    ){

      const emailText =
        section
          .querySelector(".user-email")
          ?.textContent
          ?.trim();


      if(
        emailText === user.email
      ){

        characters.classList.add("open");

        header
          .querySelector(".arrow")
          ?.classList.add("open");


        if(
          characters.dataset.loaded !== "true"
        ){

          await loadCharacters(
            userId,
            characters
          );

          characters.dataset.loaded =
            "true";

        }


        const items =
          characters.querySelectorAll(
            ".character-item"
          );


        if(characterId){

          for(const item of items){

            const characterName =
              item
                .querySelector(
                  ".character-name"
                )
                ?.textContent
                ?.trim();


            const {
              data: char
            } = await supabaseClient
              .from("characters")
              .select("*")
              .eq("id",characterId)
              .eq("user_id",userId)
              .maybeSingle();


            if(char){

              await selectCharacter(char);

              return;

            }

          }

        }


        /* Open newest character */

        const {
          data: chars
        } = await supabaseClient
          .from("characters")
          .select("*")
          .eq("user_id",userId)
          .order("created_at",{
            ascending:false
          })
          .limit(1);


        if(chars && chars.length){

          await selectCharacter(
            chars[0]
          );

        }

        return;

      }

    }

  }

}


/* =========================
   SELECT CHARACTER
========================= */

async function selectCharacter(
  character
){

  selectedCharacter =
    character;


  /* Find user if needed */

  if(!selectedUser){

    const {
      data: user
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",character.user_id)
      .single();

    selectedUser =
      user;

  }


  const name =
    character.custom_character ||
    character.character_type ||
    "Character";


  document.getElementById(
    "headerName"
  ).textContent =
    name;


  document.getElementById(
    "headerUser"
  ).textContent =
    selectedUser
      ? (
          selectedUser.name ||
          selectedUser.email ||
          "User"
        )
      : "User";


  document.getElementById(
    "headerMood"
  ).textContent =
    character.chat_experience
      ? `Mood: ${character.chat_experience}`
      : "";


  const headerAvatar =
    document.getElementById(
      "headerAvatar"
    );


  headerAvatar.style.display =
    "none";


  headerAvatar.src =
    getDefaultAvatar();


  if(character.avatar_url){

    const url =
      await createSignedUrl(
        "character-avatars",
        character.avatar_url
      );

    if(url){

      headerAvatar.src = url;

    }

  }


  headerAvatar.style.display =
    "block";


  await loadConversation(
    character
  );

}


/* =========================
   LOAD CONVERSATION
========================= */

async function loadConversation(
  character
){

  stopRealtime();


  const {
    data,
    error
  } = await supabaseClient
    .from("conversations")
    .select("*")
    .eq("user_id",character.user_id)
    .eq("character_id",character.id)
    .order("created_at",{
      ascending:false
    })
    .limit(1);


  if(error){

    console.error(error);

    showEmpty(
      "Could not load conversation."
    );

    return;

  }


  if(!data || data.length === 0){

    conversationId =
      null;


    showEmpty(
      "No conversation yet."
    );

    return;

  }


  conversationId =
    data[0].id;


  await loadMessages();

  startRealtime();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!conversationId){

    showEmpty(
      "No conversation yet."
    );

    return;

  }


  const messages =
    document.getElementById(
      "messages"
    );


  messages.innerHTML = "";


  const {
    data,
    error
  } = await supabaseClient
    .from("messages")
    .select("*")
    .eq(
      "conversation_id",
      conversationId
    )
    .order("created_at",{
      ascending:true
    });


  if(error){

    console.error(error);

    showEmpty(
      "Could not load messages."
    );

    return;

  }


  if(!data || data.length === 0){

    showEmpty(
      "No messages yet."
    );

    return;

  }


  for(const message of data){

    await addMessage(
      message
    );

  }


  scrollBottom();

}


/* =========================
   ADD MESSAGE
========================= */

async function addMessage(
  message
){

  const messages =
    document.getElementById(
      "messages"
    );


  /* Remove empty message */

  const empty =
    messages.querySelector(
      ".empty-chat"
    );

  if(empty){

    empty.remove();

  }


  const isAdmin =
    message.sender_id ===
    currentUser.id;


  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (
      isAdmin
        ? "admin"
        : "user"
    );


  const bubble =
    document.createElement("div");

  bubble.className =
    "message";


  /* Image */

  if(message.image_path){

    const imageUrl =
      await createSignedUrl(
        "chat-images",
        message.image_path
      );


    if(imageUrl){

      const img =
        document.createElement("img");

      img.className =
        "message-image";

      img.src =
        imageUrl;

      img.alt =
        message.image_name ||
        "Image";


      img.onclick =
        () => {

          window.open(
            imageUrl,
            "_blank"
          );

        };


      bubble.appendChild(img);

    }

  }


  /* Text */

  if(message.content){

    const text =
      document.createElement("div");

    text.className =
      "message-text";

    text.textContent =
      message.content;

    bubble.appendChild(text);

  }


  /* Time */

  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      message.created_at
    );


  bubble.appendChild(time);

  row.appendChild(bubble);

  messages.appendChild(row);

  scrollBottom();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(
    !selectedUser ||
    !selectedCharacter ||
    !conversationId
  ){

    alert(
      "Please select a character first."
    );

    return;

  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const content =
    input.value.trim();


  if(
    !content &&
    !selectedImage
  ){

    return;

  }


  const sendButton =
    document.getElementById(
      "sendButton"
    );


  const imageButton =
    document.getElementById(
      "imageButton"
    );


  sendButton.disabled =
    true;

  imageButton.disabled =
    true;


  try{

    let imagePath =
      null;

    let imageType =
      null;

    let imageName =
      null;


    /* =========================
       UPLOAD IMAGE
    ========================= */

    if(selectedImage){

      const extension =
        selectedImage.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        `${selectedUser.id}/${conversationId}/${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const {
        error
      } = await supabaseClient
        .storage
        .from("chat-images")
        .upload(
          fileName,
          selectedImage,
          {
            contentType:
              selectedImage.type,

            upsert:false
          }
        );


      if(error){

        throw error;

      }


      imagePath =
        fileName;

      imageType =
        selectedImage.type;

      imageName =
        selectedImage.name;

    }


    /* =========================
       INSERT MESSAGE
    ========================= */

    const {
      error
    } = await supabaseClient
      .from("messages")
      .insert({

        conversation_id:
          conversationId,

        sender_id:
          currentUser.id,

        content:
          content,

        image_path:
          imagePath,

        image_type:
          imageType,

        image_name:
          imageName

      });


    if(error){

      throw error;

    }


    /* Clear input */

    input.value =
      "";

    input.style.height =
      "42px";


    removeImage();


  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );

    alert(
      "Could not send message."
    );

  }finally{

    sendButton.disabled =
      false;

    imageButton.disabled =
      false;


    input.focus();

  }

}


/* =========================
   ENTER TO SEND
========================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event){

      /*
        Enter = Send

        Shift + Enter =
        New line
      */

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   IMAGE INPUT
========================= */

document
  .getElementById("imageInput")
  .addEventListener(
    "change",
    function(event){

      const file =
        event.target.files[0];


      if(!file){

        return;

      }


      if(!file.type.startsWith("image/")){

        alert(
          "Please select an image."
        );

        event.target.value =
          "";

        return;

      }


      /* 5 MB */

      if(file.size > 5 * 1024 * 1024){

        alert(
          "Image must be smaller than 5 MB."
        );

        event.target.value =
          "";

        return;

      }


      selectedImage =
        file;


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          document.getElementById(
            "previewImage"
          ).src =
            e.target.result;


          document.getElementById(
            "imagePreview"
          ).classList.add("show");

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================
   REMOVE IMAGE
========================= */

function removeImage(){

  selectedImage =
    null;


  document.getElementById(
    "imageInput"
  ).value =
    "";


  document.getElementById(
    "previewImage"
  ).src =
    "";


  document.getElementById(
    "imagePreview"
  ).classList.remove(
    "show"
  );

}


/* =========================
   REALTIME
========================= */

function startRealtime(){

  if(!conversationId){

    return;

  }


  stopRealtime();


  realtimeChannel =
    supabaseClient
      .channel(
        "admin-chat-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `conversation_id=eq.${conversationId}`
        },
        async payload => {

          console.log(
            "REALTIME MESSAGE:",
            payload.new
          );


          await addMessage(
            payload.new
          );

        }
      )
      .subscribe(
        status => {

          console.log(
            "ADMIN REALTIME:",
            status
          );

        }
      );

}


/* =========================
   STOP REALTIME
========================= */

function stopRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;

  }

}


/* =========================
   SIGNED URL
========================= */

async function createSignedUrl(
  bucket,
  path
){

  if(!path){

    return null;

  }


  try{

    const {
      data,
      error
    } = await supabaseClient
      .storage
      .from(bucket)
      .createSignedUrl(
        path,
        60 * 60
      );


    if(error){

      console.error(
        "SIGNED URL ERROR:",
        error
      );

      return null;

    }


    return data?.signedUrl || null;

  }catch(error){

    console.error(error);

    return null;

  }

}

/* =========================
   SHOW EMPTY
========================= */

function showEmpty(
  text
){

  document.getElementById(
    "messages"
  ).innerHTML = `

    <div class="empty-chat">

      <h3>${escapeHtml(text)}</h3>

    </div>

  `;

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  const messages =
    document.getElementById(
      "messages"
    );


  setTimeout(() => {

    messages.scrollTop =
      messages.scrollHeight;

  },50);

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(value);


  return date.toLocaleString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   FILE SIZE
========================= */

function formatFileSize(
  bytes
){

  if(!bytes){

    return "";

  }


  if(bytes < 1024){

    return bytes + " B";

  }


  if(bytes < 1024 * 1024){

    return (
      (bytes / 1024)
        .toFixed(1) +
      " KB"
    );

  }


  return (
    (bytes / (1024 * 1024))
      .toFixed(1) +
    " MB"
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  text
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text ?? "";


  return div.innerHTML;

}


/* =========================
   BACK TO ADMIN
========================= */

function backToAdmin(){

  window.location.href =
    "admin.html";

}

   AUTO RESIZE TEXTAREA
========================= */

document

  .addEventListener(

        "42px";

   BEFORE UNLOAD
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopRealtime();

  }
);


/* =========================
   START
========================= */

init();
