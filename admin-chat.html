<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,rgba(124,58,237,.30),transparent 35%),
    radial-gradient(circle at bottom right,rgba(6,182,212,.20),transparent 35%),
    #070b14;
  color:white;
  padding:16px;
}

.app{
  width:100%;
  max-width:1200px;
  height:calc(100vh - 32px);
  margin:auto;
  display:flex;
  overflow:hidden;
  border-radius:22px;
  background:rgba(15,23,42,.78);
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:310px;
  flex-shrink:0;
  border-right:1px solid rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
}

.sidebar-header{
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.sidebar-title{
  font-size:19px;
  font-weight:800;
}

.sidebar-subtitle{
  margin-top:5px;
  font-size:12px;
  color:rgba(255,255,255,.45);
}

.users{
  flex:1;
  overflow-y:auto;
  padding-bottom:10px;
}

.user-section{
  border-bottom:1px solid rgba(255,255,255,.06);
}

.user-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 15px;
  cursor:pointer;
  transition:.2s;
}

.user-item:hover{
  background:rgba(255,255,255,.05);
}

.user-item.active{
  background:rgba(124,58,237,.15);
}

.user-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  overflow:hidden;
  font-size:19px;
}

.user-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-email{
  margin-top:3px;
  font-size:10px;
  color:rgba(255,255,255,.40);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.character-list{
  display:none;
  padding:4px 8px 10px 48px;
}

.character-list.show{
  display:block;
}

.character-item{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px;
  margin:3px 0;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
  background:rgba(255,255,255,.025);
}

.character-item:hover{
  background:rgba(255,255,255,.07);
}

.character-item.active{
  background:rgba(124,58,237,.28);
  border:1px solid rgba(139,92,246,.35);
}

.character-avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  font-size:16px;
}

.character-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.character-info{
  min-width:0;
  flex:1;
}

.character-name{
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.character-type{
  margin-top:2px;
  font-size:9px;
  color:rgba(255,255,255,.45);
}

.character-mood{
  margin-top:3px;
  font-size:9px;
  color:#c4b5fd;
}

.no-character{
  font-size:10px;
  color:rgba(255,255,255,.35);
  padding:6px 0;
}

.empty{
  margin:auto;
  text-align:center;
  color:rgba(255,255,255,.45);
  padding:20px;
  font-size:13px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chat-header{
  min-height:74px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.back-button{
  display:none;
  width:40px;
  height:40px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:22px;
  cursor:pointer;
}

.chat-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:21px;
  flex-shrink:0;
}

.chat-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chat-user-name{
  font-size:16px;
  font-weight:800;
}

.chat-character{
  margin-top:3px;
  font-size:11px;
  color:rgba(255,255,255,.45);
}

.chat-mood{
  margin-top:4px;
  font-size:10px;
  color:#c4b5fd;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:22px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.admin{
  justify-content:flex-end;
}

.message-row.user{
  justify-content:flex-start;
}

.bubble{
  max-width:min(72%,560px);
  padding:11px 14px;
  border-radius:18px;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.message-row.admin .bubble{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  border-bottom-right-radius:5px;
}

.message-row.user .bubble{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.message-image{
  display:block;
  max-width:330px;
  max-height:420px;
  width:100%;
  object-fit:contain;
  border-radius:13px;
  background:rgba(0,0,0,.15);
  cursor:pointer;
}

.message-text{
  margin-top:8px;
  white-space:pre-wrap;
}

.message-text.only{
  margin-top:0;
}

.time{
  margin-top:5px;
  font-size:10px;
  opacity:.55;
  text-align:right;
}

/* =========================
   PREVIEW
========================= */

.preview{
  display:none;
  align-items:center;
  gap:10px;
  padding:9px 14px;
  border-top:1px solid rgba(255,255,255,.07);
}

.preview.show{
  display:flex;
}

.preview img{
  width:55px;
  height:55px;
  border-radius:10px;
  object-fit:cover;
}

.preview-info{
  flex:1;
  min-width:0;
}

.preview-name{
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.preview-size{
  font-size:10px;
  opacity:.45;
  margin-top:3px;
}

.remove-preview{
  width:32px;
  height:32px;
  border:none;
  border-radius:9px;
  background:rgba(239,68,68,.15);
  color:#f87171;
  cursor:pointer;
}

/* =========================
   COMPOSER
========================= */

.composer{
  padding:11px 13px 13px;
  border-top:1px solid rgba(255,255,255,.08);
}

.composer-inner{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.image-button{
  width:45px;
  height:45px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:13px;
  background:rgba(255,255,255,.07);
  color:#c4b5fd;
  cursor:pointer;
  font-size:20px;
  flex-shrink:0;
}

#fileInput{
  display:none;
}

#messageInput{
  flex:1;
  min-height:45px;
  max-height:130px;
  resize:none;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  background:rgba(255,255,255,.07);
  color:white;
  outline:none;
  padding:12px 13px;
  font-family:inherit;
  font-size:14px;
}

#messageInput::placeholder{
  color:rgba(255,255,255,.40);
}

.send-button{
  width:45px;
  height:45px;
  border:none;
  border-radius:13px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  color:white;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.notice{
  text-align:center;
  font-size:9px;
  opacity:.35;
  margin-top:6px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  body{
    padding:0;
  }

  .app{
    height:100vh;
    border-radius:0;
  }

  .sidebar{
    width:85px;
  }

  .sidebar-header{
    padding:14px 8px;
    text-align:center;
  }

  .sidebar-title{
    font-size:12px;
  }

  .sidebar-subtitle{
    display:none;
  }

  .user-item{
    justify-content:center;
    padding:12px 6px;
  }

  .user-info{
    display:none;
  }

  .character-list{
    padding:4px 4px 8px;
  }

  .character-info{
    display:none;
  }

  .character-item{
    justify-content:center;
    padding:5px;
  }

  .character-mood{
    display:none;
  }

  .back-button{
    display:block;
  }

  .chat-header{
    padding:10px;
  }

  .bubble{
    max-width:82%;
  }

  .message-image{
    max-width:250px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="sidebar-header">

      <div class="sidebar-title">
        Admin Chat
      </div>

      <div class="sidebar-subtitle">
        Approved users • All characters
      </div>

    </div>

    <div class="users" id="users">

      <div class="empty">
        Loading...
      </div>

    </div>

  </div>


  <!-- CHAT -->

  <div class="chat">

    <div class="chat-header">

      <button
        class="back-button"
        onclick="backToAdmin()">
        ‹
      </button>

      <div
        class="chat-avatar"
        id="chatAvatar">
        💬
      </div>

      <div>

        <div
          class="chat-user-name"
          id="chatUserName">
          Select a character
        </div>

        <div
          class="chat-character"
          id="chatCharacter">
        </div>

        <div
          class="chat-mood"
          id="chatMood">
        </div>

      </div>

    </div>


    <div
      class="messages"
      id="messages">

      <div class="empty">
        Select a character to view messages.
      </div>

    </div>


    <!-- PREVIEW -->

    <div
      class="preview"
      id="preview">

      <img id="previewImage">

      <div class="preview-info">

        <div
          class="preview-name"
          id="previewName">
        </div>

        <div
          class="preview-size"
          id="previewSize">
        </div>

      </div>

      <button
        class="remove-preview"
        onclick="removeImage()">
        ×
      </button>

    </div>


    <!-- COMPOSER -->

    <div class="composer">

      <div class="composer-inner">

        <button
          class="image-button"
          id="imageButton"
          onclick="document.getElementById('fileInput').click()">
          🖼️
        </button>

        <input
          type="file"
          id="fileInput"
          accept="image/jpeg,image/png,image/webp,image/gif">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Reply to user...">
        </textarea>

        <button
          class="send-button"
          id="sendButton"
          onclick="sendMessage()">
          ➤
        </button>

      </div>

      <div class="notice">
        Press Enter to send • Shift + Enter for new line
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;

let selectedUser = null;

let selectedCharacter = null;

let conversationId = null;

let realtimeChannel = null;

let selectedImage = null;


/* =========================
   INIT
========================= */

async function init(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  if(!session){

    window.location.replace(
      "index.html"
    );

    return;
  }

  currentUser =
    session.user;

  const {
    data:profile
  } =
    await supabaseClient
      .from("profiles")
      .select("role,status")
      .eq("id",currentUser.id)
      .single();

  if(
    !profile ||
    profile.role !== "admin" ||
    profile.status !== "approved"
  ){

    await supabaseClient
      .auth
      .signOut();

    window.location.replace(
      "index.html"
    );

    return;
  }

  await loadUsers();

  const params =
    new URLSearchParams(
      window.location.search
    );

  const userId =
    params.get("user");

  const characterId =
    params.get("character");

  if(userId){

    await selectUser(
      userId,
      characterId
    );

  }

}


/* =========================
   LOAD USERS + ALL CHARACTERS
========================= */

async function loadUsers(){

  const container =
    document.getElementById(
      "users"
    );

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("id,name,email")
      .eq("role","user")
      .eq("status","approved")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(error){

    console.error(
      "Users error:",
      error
    );

    container.innerHTML =
      `<div class="empty">
        Could not load users.
      </div>`;

    return;
  }

  container.innerHTML = "";

  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="empty">
        No approved users.
      </div>`;

    return;
  }

  for(const user of data){

    await createUserSection(
      container,
      user
    );

  }

}


/* =========================
   CREATE USER SECTION
========================= */

async function createUserSection(
  container,
  user
){

  const section =
    document.createElement(
      "div"
    );

  section.className =
    "user-section";

  section.dataset.userId =
    user.id;

  const userItem =
    document.createElement(
      "div"
    );

  userItem.className =
    "user-item";

  userItem.dataset.userId =
    user.id;

  userItem.innerHTML = `

    <div class="user-avatar">
      👤
    </div>

    <div class="user-info">

      <div class="user-name">
        ${escapeHtml(
          user.name || "User"
        )}
      </div>

      <div class="user-email">
        ${escapeHtml(
          user.email || ""
        )}
      </div>

    </div>

  `;

  userItem.onclick =
    () => selectUser(
      user.id
    );

  section.appendChild(
    userItem
  );

  const characterList =
    document.createElement(
      "div"
    );

  characterList.className =
    "character-list";

  characterList.dataset.userId =
    user.id;

  section.appendChild(
    characterList
  );

  container.appendChild(
    section
  );

  await loadUserAvatar(
    userItem.querySelector(
      ".user-avatar"
    ),
    user.id
  );

  await loadCharacters(
    user.id,
    characterList
  );

}


/* =========================
   LOAD ALL CHARACTERS
========================= */

async function loadCharacters(
  userId,
  container
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("characters")
      .select("*")
      .eq(
        "user_id",
        userId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(error){

    console.error(
      "Characters error:",
      error
    );

    container.innerHTML =
      `<div class="no-character">
        Could not load characters.
      </div>`;

    return;
  }

  container.innerHTML = "";

  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="no-character">
        No characters yet
      </div>`;

    return;
  }

  for(const character of data){

    const item =
      await createCharacterItem(
        character
      );

    container.appendChild(
      item
    );

  }

}


/* =========================
   CHARACTER ITEM
========================= */

async function createCharacterItem(
  character
){

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "character-item";

  item.dataset.characterId =
    character.id;

  let characterName =
    character.custom_character ||
    character.character_type ||
    "Character";

  let mood =
    character.chat_experience ||
    "Normal";

  item.innerHTML = `

    <div class="character-avatar">
      ${getAvatar(
        character.character_type
      )}
    </div>

    <div class="character-info">

      <div class="character-name">
        ${escapeHtml(
          characterName
        )}
      </div>

      <div class="character-type">
        ${escapeHtml(
          character.character_type ||
          "Other"
        )}
      </div>

      <div class="character-mood">
        💭 ${escapeHtml(
          mood
        )}
      </div>

    </div>

  `;

  item.onclick =
    event => {

      event.stopPropagation();

      selectCharacter(
        character
      );

    };

  if(character.avatar_url){

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from("character-avatars")
        .createSignedUrl(
          character.avatar_url,
          3600
        );

    if(
      !error &&
      data &&
      data.signedUrl
    ){

      item
        .querySelector(
          ".character-avatar"
        )
        .innerHTML = `

          <img
            src="${data.signedUrl}"
            alt="Character">

        `;

    }

  }

  return item;

}


/* =========================
   USER AVATAR
========================= */

async function loadUserAvatar(
  avatarElement,
  userId
){

  const {
    data:character
  } =
    await supabaseClient
      .from("characters")
      .select(
        "avatar_url,character_type"
      )
      .eq(
        "user_id",
        userId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(1)
      .maybeSingle();

  if(!character){

    return;
  }

  if(!character.avatar_url){

    avatarElement.textContent =
      getAvatar(
        character.character_type
      );

    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from("character-avatars")
      .createSignedUrl(
        character.avatar_url,
        3600
      );

  if(
    !error &&
    data &&
    data.signedUrl
  ){

    avatarElement.innerHTML = `

      <img
        src="${data.signedUrl}"
        alt="Character">

    `;

  }

}


/* =========================
   SELECT USER
========================= */

async function selectUser(
  userId,
  characterId = null
){

  selectedUser =
    userId;

  document
    .querySelectorAll(
      ".user-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.userId ===
          userId
        );

      }
    );

  /* Open character list */

  document
    .querySelectorAll(
      ".character-list"
    )
    .forEach(
      list => {

        list.classList.toggle(
          "show",
          list.dataset.userId ===
          userId
        );

      }
    );

  const {
    data:profile
  } =
    await supabaseClient
      .from("profiles")
      .select("name,email")
      .eq("id",userId)
      .single();

  if(!profile){

    return;
  }

  document
    .getElementById(
      "chatUserName"
    )
    .textContent =
      profile.name ||
      "User";

  /*
     If URL has a specific
     character, open it.
  */

  if(characterId){

    const {
      data:character
    } =
      await supabaseClient
        .from("characters")
        .select("*")
        .eq(
          "id",
          characterId
        )
        .eq(
          "user_id",
          userId
        )
        .maybeSingle();

    if(character){

      await selectCharacter(
        character
      );

      return;
    }

  }

  /*
     Otherwise select first
     character automatically.
  */

  const {
    data:characters
  } =
    await supabaseClient
      .from("characters")
      .select("*")
      .eq(
        "user_id",
        userId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(
    characters &&
    characters.length > 0
  ){

    await selectCharacter(
      characters[0]
    );

  }else{

    selectedCharacter =
      null;

    conversationId =
      null;

    showEmpty(
      "This user has no character yet."
    );

  }

}


/* =========================
   SELECT CHARACTER
========================= */

async function selectCharacter(
  character
){

  selectedCharacter =
    character;

  selectedUser =
    character.user_id;

  document
    .querySelectorAll(
      ".character-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.characterId ===
          character.id
        );

      }
    );

  updateCharacterHeader(
    character
  );

  await loadConversation(
    character
  );

}


/* =========================
   CHARACTER HEADER
========================= */

async function updateCharacterHeader(
  character
){

  const avatar =
    document.getElementById(
      "chatAvatar"
    );

  const characterText =
    document.getElementById(
      "chatCharacter"
    );

  const moodText =
    document.getElementById(
      "chatMood"
    );

  const {
    data:profile
  } =
    await supabaseClient
      .from("profiles")
      .select("name")
      .eq(
        "id",
        character.user_id
      )
      .maybeSingle();

  document
    .getElementById(
      "chatUserName"
    )
    .textContent =
      profile?.name ||
      "User";

  characterText.textContent =
    character.custom_character ||
    character.character_type ||
    "Character";

  moodText.textContent =
    "💭 Chat: " +
    (
      character.chat_experience ||
      "Normal"
    );

  avatar.textContent =
    getAvatar(
      character.character_type
    );

  if(character.avatar_url){

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from("character-avatars")
        .createSignedUrl(
          character.avatar_url,
          3600
        );

    if(
      !error &&
      data &&
      data.signedUrl
    ){

      avatar.innerHTML = `

        <img
          src="${data.signedUrl}"
          alt="Character picture">

      `;

    }

  }

}


/* =========================
   AVATAR
========================= */

function getAvatar(type){

  const avatars = {

    Father:"👨",

    Mother:"👩",

    Boyfriend:"🧑",

    Girlfriend:"👩",

    "Male Teacher":"👨‍🏫",

    "Female Teacher":"👩‍🏫",

    Other:"💬"

  };

  return avatars[type] ||
    "💬";

}


/* =========================
   CONVERSATION
========================= */

async function loadConversation(
  character
){

  if(realtimeChannel){

    await supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;
  }

  conversationId =
    null;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq(
        "user_id",
        character.user_id
      )
      .eq(
        "character_id",
        character.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(1)
      .maybeSingle();

  if(error){

    console.error(
      "Conversation error:",
      error
    );

    showEmpty(
      "Could not load conversation."
    );

    return;
  }

  if(!data){

    showEmpty(
      "No conversation yet for this character."
    );

    return;
  }

  conversationId =
    data.id;

  await loadMessages();

  startRealtime();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  const container =
    document.getElementById(
      "messages"
    );

  container.innerHTML =
    "";

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(error){

    console.error(
      "Messages error:",
      error
    );

    showEmpty(
      "Could not load messages."
    );

    return;
  }

  if(!data || data.length === 0){

    showEmpty(
      "No messages yet."
    );

    return;
  }

  for(const message of data){

    await addMessage(
      message
    );

  }

  scrollBottom();

}


/* =========================
   ADD MESSAGE
========================= */

async function addMessage(
  message
){

  if(message.id){

    const existing =
      document.querySelector(
        `[data-message-id="${message.id}"]`
      );

    if(existing){

      return;

    }

  }

  const isAdmin =
    message.sender_id ===
    currentUser.id;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    `message-row ${
      isAdmin
        ? "admin"
        : "user"
    }`;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  if(message.id){

    bubble.dataset.messageId =
      message.id;

  }


  /* IMAGE */

  if(message.image_path){

    const image =
      document.createElement(
        "img"
      );

    image.className =
      "message-image";

    image.alt =
      message.image_name ||
      "Chat image";

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from("chat-images")
        .createSignedUrl(
          message.image_path,
          3600
        );

    if(
      !error &&
      data &&
      data.signedUrl
    ){

      image.src =
        data.signedUrl;

      image.onclick =
        () => {

          window.open(
            data.signedUrl,
            "_blank"
          );

        };

    }

    bubble.appendChild(
      image
    );

  }


  /* TEXT */

  if(message.content){

    const text =
      document.createElement(
        "div"
      );

    text.className =
      message.image_path
        ? "message-text"
        : "message-text only";

    text.textContent =
      message.content;

    bubble.appendChild(
      text
    );

  }


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "time";

  time.textContent =
    formatTime(
      message.created_at
    );

  bubble.appendChild(
    time
  );

  row.appendChild(
    bubble
  );

  document
    .getElementById(
      "messages"
    )
    .appendChild(
      row
    );

  scrollBottom();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(
    !selectedUser ||
    !selectedCharacter ||
    !conversationId
  ){

    alert(
      "Please select a character first."
    );

    return;
  }

  const input =
    document.getElementById(
      "messageInput"
    );

  const content =
    input.value.trim();

  if(
    !content &&
    !selectedImage
  ){

    return;
  }

  const sendButton =
    document.getElementById(
      "sendButton"
    );

  const imageButton =
    document.getElementById(
      "imageButton"
    );

  sendButton.disabled =
    true;

  imageButton.disabled =
    true;

  try{

    let imagePath =
      null;

    let imageType =
      null;

    let imageName =
      null;

    if(selectedImage){

      const extension =
        selectedImage.name
          .split(".")
          .pop()
          .toLowerCase();

      const fileName =
        `${selectedUser}/${conversationId}/${Date.now()}-${crypto.randomUUID()}.${extension}`;

      const {
        error
      } =
        await supabaseClient
          .storage
          .from("chat-images")
          .upload(
            fileName,
            selectedImage,
            {
              contentType:
                selectedImage.type,

              upsert:false
            }
          );

      if(error){

        throw error;

      }

      imagePath =
        fileName;

      imageType =
        selectedImage.type;

      imageName =
        selectedImage.name;

    }

    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({

          conversation_id:
            conversationId,

          sender_id:
            currentUser.id,

          content:
            content,

          image_path:
            imagePath,

          image_type:
            imageType,

          image_name:
            imageName

        });

    if(error){

      throw error;

    }

    input.value =
      "";

    input.style.height =
      "45px";

    removeImage();

  }catch(error){

    console.error(
      error
    );

    alert(
      "Could not send message."
    );

  }finally{

    sendButton.disabled =
      false;

    imageButton.disabled =
      false;

    input.focus();

  }

}


/* =========================
   IMAGE SELECT
========================= */

document
  .getElementById(
    "fileInput"
  )
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if(!file){

        return;

      }

      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        alert(
          "Please select an image."
        );

        event.target.value =
          "";

        return;

      }

      if(
        file.size >
        10 * 1024 * 1024
      ){

        alert(
          "Image must be smaller than 10 MB."
        );

        event.target.value =
          "";

        return;

      }

      selectedImage =
        file;

      const reader =
        new FileReader();

      reader.onload =
        e => {

          document
            .getElementById(
              "previewImage"
            )
            .src =
              e.target.result;

          document
            .getElementById(
              "previewName"
            )
            .textContent =
              file.name;

          document
            .getElementById(
              "previewSize"
            )
            .textContent =
              formatFileSize(
                file.size
              );

          document
            .getElementById(
              "preview"
            )
            .classList.add(
              "show"
            );

        };

      reader.readAsDataURL(
        file
      );

    });


function removeImage(){

  selectedImage =
    null;

  document
    .getElementById(
      "fileInput"
    )
    .value =
      "";

  document
    .getElementById(
      "preview"
    )
    .classList.remove(
      "show"
    );

}


/* =========================
   REALTIME
========================= */

function startRealtime(){

  if(!conversationId){

    return;

  }

  realtimeChannel =
    supabaseClient
      .channel(
        "admin-chat-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `conversation_id=eq.${conversationId}`
        },
        async payload => {

          /*
             Make sure message belongs
             to currently selected chat.
          */

          if(
            payload.new.conversation_id !==
            conversationId
          ){

            return;

          }

          await addMessage(
            payload.new
          );

        }
      )
      .subscribe(
        status => {

          console.log(
            "Admin realtime:",
            status
          );

        }
      );

}


/* =========================
   HELPERS
========================= */

function showEmpty(
  text
){

  document
    .getElementById(
      "messages"
    )
    .innerHTML = `

      <div class="empty">
        ${escapeHtml(text)}
      </div>

    `;

}


function scrollBottom(){

  const messages =
    document.getElementById(
      "messages"
    );

  setTimeout(
    () => {

      messages.scrollTop =
        messages.scrollHeight;

    },
    30
  );

}


function formatTime(
  value
){

  return new Date(
    value
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatFileSize(
  bytes
){

  if(bytes < 1024){

    return bytes + " B";

  }

  if(
    bytes <
    1024 * 1024
  ){

    return (
      bytes / 1024
    ).toFixed(1) +
    " KB";

  }

  return (
    bytes /
    (1024 * 1024)
  ).toFixed(1) +
    " MB";

}


function escapeHtml(
  value
){

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function backToAdmin(){

  window.location.replace(
    "admin.html"
  );

}


/* =========================
   START
========================= */

init();


window.addEventListener(
  "beforeunload",
  () => {

    if(realtimeChannel){

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

  }
);

</script>
