<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Personal Chatbot Partner</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 10% 15%, rgba(124, 58, 237, 0.30), transparent 32%),
        radial-gradient(circle at 90% 85%, rgba(37, 99, 235, 0.25), transparent 32%),
        linear-gradient(135deg, #050816, #0b1026 50%, #111936);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
    overflow-x: hidden;
}

/* Main card */

.box {
    width: 100%;
    max-width: 430px;

    padding: 36px;

    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 26px;

    background: rgba(15, 23, 42, 0.78);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255,255,255,0.07);
}

/* Logo */

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 18px;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    background: linear-gradient(135deg, #8b5cf6, #3b82f6);

    box-shadow:
        0 10px 30px rgba(99,102,241,0.30);
}

/* Heading */

h1 {
    margin: 0;

    text-align: center;

    font-size: 27px;
    line-height: 1.2;

    letter-spacing: -0.4px;
}

.subtitle {
    margin: 10px auto 28px;

    max-width: 320px;

    text-align: center;

    color: #aeb8d0;

    font-size: 14px;
    line-height: 1.55;
}

/* Form */

label {
    display: block;

    margin: 17px 0 8px;

    color: #dbe4ff;

    font-size: 13px;
    font-weight: 600;
}

.input-wrap {
    position: relative;
    width: 100%;
}

.input-wrap span {
    position: absolute;

    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: #8b96ae;

    font-size: 15px;

    pointer-events: none;
}

input {
    display: block;

    width: 100%;
    max-width: 100%;

    height: 50px;

    padding: 0 14px 0 43px;

    border: 1px solid rgba(255,255,255,0.11);
    border-radius: 13px;

    outline: none;

    background: rgba(255,255,255,0.055);

    color: white;

    font-size: 15px;

    -webkit-appearance: none;
}

input::placeholder {
    color: #75809b;
}

input:focus {
    border-color: rgba(139,92,246,0.8);

    background: rgba(255,255,255,0.08);

    box-shadow:
        0 0 0 3px rgba(139,92,246,0.10);
}

/* Login button */

button {
    display: block;

    width: 100%;
    max-width: 100%;

    height: 50px;

    margin-top: 24px;

    border: none;
    border-radius: 13px;

    background: linear-gradient(135deg, #8b5cf6, #6366f1);

    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 28px rgba(99,102,241,0.25);

    transition: 0.2s ease;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 14px 32px rgba(99,102,241,0.35);
}

button:active {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* Message */

#message {
    width: 100%;

    margin-top: 16px;

    min-height: 20px;

    text-align: center;

    font-size: 13px;

    line-height: 1.45;

    overflow-wrap: anywhere;
}

/* Register */

.register {
    width: 100%;

    margin-top: 22px;
    padding-top: 20px;

    border-top: 1px solid rgba(255,255,255,0.08);

    text-align: center;

    color: #8e9ab5;

    font-size: 13px;

    line-height: 1.5;
}

.register a {
    color: #b9a4ff;

    font-weight: 700;

    text-decoration: none;
}

/* Footer */

.footer {
    margin-top: 18px;

    text-align: center;

    color: #59657f;

    font-size: 11px;
}

/* Small phones */

@media (max-width: 480px) {

    body {
        align-items: center;

        padding:
            16px
            max(16px, env(safe-area-inset-right))
            16px
            max(16px, env(safe-area-inset-left));
    }

    .box {
        max-width: 100%;

        padding: 28px 20px;

        border-radius: 22px;
    }

    .logo {
        width: 60px;
        height: 60px;

        margin-bottom: 16px;

        border-radius: 18px;

        font-size: 27px;
    }

    h1 {
        font-size: 23px;
    }

    .subtitle {
        font-size: 13px;

        margin-bottom: 24px;
    }

    label {
        margin-top: 15px;
    }

    input,
    button {
        height: 48px;
    }
}

/* Very small phones */

@media (max-width: 360px) {

    body {
        padding: 12px;
    }

    .box {
        padding: 24px 16px;

        border-radius: 20px;
    }

    .logo {
        width: 56px;
        height: 56px;
    }

    h1 {
        font-size: 21px;
    }

    .subtitle {
        font-size: 12px;
    }

    input,
    button {
        font-size: 14px;
    }
}
</style>

</head>

<body>

<div class="box">

```
<div class="logo">✦</div>

<h1>Personal Chatbot Partner</h1>

<div class="subtitle">
    Sign in to continue your personal chat experience.
</div>

<form id="loginForm">

    <label for="email">Email</label>

    <div class="input-wrap">
        <span>✉</span>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >
    </div>

    <label for="password">Password</label>

    <div class="input-wrap">
        <span>●</span>

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >
    </div>

    <button id="loginButton" type="submit">
        Login
    </button>

</form>

<div id="message"></div>

<div class="register">
    Don't have an account?
    <a href="register.html">Create Account</a>
</div>

<div class="footer">
    Personal Chatbot Partner
</div>
```

</div>

<script>

const SUPABASE_URL =
"https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");

    button.disabled = true;
    button.textContent = "Logging in...";

    message.textContent = "";

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw error;
        }

        if (!data.user) {
            throw new Error("Login failed.");
        }

        const { data: profile, error: profileError } =
            await supabaseClient
            .from("profiles")
            .select("name, role, status")
            .eq("id", data.user.id)
            .single();

        if (profileError) {
            throw profileError;
        }

        if (profile.status !== "approved") {

            await supabaseClient.auth.signOut();

            message.style.color = "#fbbf24";

            message.textContent =
                "Your account is waiting for admin approval.";

            button.disabled = false;
            button.textContent = "Login";

            return;
        }

        if (profile.role === "admin") {

            window.location.href = "admin.html";

        } else {

            window.location.href = "dashboard.html";

        }

    } catch (error) {

        message.style.color = "#fca5a5";

        message.textContent =
            error.message ||
            "Invalid email or password.";

        button.disabled = false;
        button.textContent = "Login";
    }

});

</script>

</body>
</html>
