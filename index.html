<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Personal Chatbot Partner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81, #701a75);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7c3aed;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #d1d5db;
    }

    a {
      color: #c4b5fd;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Personal Chatbot Partner</h1>

    <div class="subtitle">
      Sign in to continue
    </div>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >

      <button id="loginButton" type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    button.disabled = true;

    button.textContent = "Logging in...";

    message.textContent = "";


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {
        throw error;
      }


      if (!data.user) {
        throw new Error("Login failed.");
      }


      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("name, role, status")
          .eq("id", data.user.id)
          .single();


      if (profileError) {
        throw profileError;
      }


      if (profile.status !== "approved") {

        await supabaseClient.auth.signOut();

        message.style.color = "#fbbf24";

        message.textContent =
          "Your account is waiting for admin approval.";

        button.disabled = false;
        button.textContent = "Login";

        return;
      }


      if (profile.role === "admin") {

        window.location.href = "admin.html";

      } else {

        window.location.href = "dashboard.html";

      }

    }

    catch (error) {

      message.style.color = "#fca5a5";

      message.textContent =
        error.message || "Invalid email or password.";

      button.disabled = false;

      button.textContent = "Login";

    }

  });

</script>

</body>
</html>
