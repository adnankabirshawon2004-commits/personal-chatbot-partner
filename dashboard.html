<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Your Character</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;
      padding: 24px;

      background:
        radial-gradient(
          circle at top left,
          rgba(124, 58, 237, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(6, 182, 212, 0.25),
          transparent 35%
        ),
        #070b14;

      color: white;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .logout {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.07);
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      cursor: pointer;
    }

    .card {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 26px;
      padding: 30px;

      backdrop-filter: blur(22px);

      box-shadow:
        0 25px 80px rgba(0,0,0,0.40);
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .section {
      margin-bottom: 26px;
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .option {
      padding: 13px 14px;
      border-radius: 13px;

      border: 1px solid rgba(255,255,255,0.10);

      background: rgba(255,255,255,0.05);

      color: white;
      cursor: pointer;

      font-size: 13px;

      transition: 0.2s;
    }

    .option:hover {
      background: rgba(124,58,237,0.15);
      border-color: rgba(124,58,237,0.45);
    }

    .option.selected {
      background: linear-gradient(
        135deg,
        rgba(124,58,237,0.40),
        rgba(37,99,235,0.35)
      );

      border-color: rgba(139,92,246,0.8);

      box-shadow:
        0 8px 25px rgba(124,58,237,0.15);
    }

    input,
    select {
      width: 100%;

      padding: 13px 14px;

      border-radius: 13px;

      border: 1px solid rgba(255,255,255,0.10);

      background: rgba(255,255,255,0.06);

      color: white;

      outline: none;

      font-size: 14px;
    }

    input::placeholder {
      color: rgba(255,255,255,0.38);
    }

    input:focus,
    select:focus {
      border-color: rgba(124,58,237,0.7);

      box-shadow:
        0 0 0 3px rgba(124,58,237,0.10);
    }

    select option {
      background: #111827;
      color: white;
    }

    .custom-name {
      display: none;
      margin-top: 12px;
    }

    /* =========================
       CHARACTER PICTURE
    ========================= */

    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      padding: 22px;

      border-radius: 20px;

      border: 1px dashed rgba(255,255,255,0.16);

      background: rgba(255,255,255,0.035);

      margin-bottom: 8px;
    }

    .avatar-preview {
      width: 120px;
      height: 120px;

      border-radius: 50%;

      object-fit: cover;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #06b6d4
        );

      border: 4px solid rgba(255,255,255,0.10);

      box-shadow:
        0 12px 35px rgba(0,0,0,0.30);

      font-size: 48px;

      margin-bottom: 14px;

      overflow: hidden;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .avatar-description {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 15px;
    }

    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 11px 17px;

      border-radius: 12px;

      background: rgba(124,58,237,0.18);

      border: 1px solid rgba(139,92,246,0.45);

      color: #ddd6fe;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .upload-button:hover {
      background: rgba(124,58,237,0.30);
    }

    #avatarInput {
      display: none;
    }

    .remove-avatar {
      display: none;

      margin-top: 9px;

      border: none;

      background: transparent;

      color: #f87171;

      font-size: 12px;

      cursor: pointer;
    }

    .remove-avatar.show {
      display: block;
    }

    .hint {
      font-size: 11px;
      color: rgba(255,255,255,0.38);
      margin-top: 8px;
    }

    .create-button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #2563eb
        );

      color: white;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 12px 30px rgba(37,99,235,0.25);

      transition: 0.2s;
    }

    .create-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 15px 35px rgba(37,99,235,0.32);
    }

    .create-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 12px;

      text-align: center;

      font-size: 13px;
    }

    .message.error {
      display: block;

      background: rgba(239,68,68,0.10);

      border: 1px solid rgba(239,68,68,0.20);

      color: #fca5a5;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 21px;
      }

      .title {
        font-size: 25px;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .avatar-preview {
        width: 105px;
        height: 105px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <div class="brand">
      Personal Chatbot
    </div>

    <button
      class="logout"
      onclick="logout()">
      Logout
    </button>

  </div>


  <div class="card">

    <div class="title">
      Create Your Character
    </div>

    <div class="subtitle">
      Customize your character and choose how you want your chat experience to feel.
    </div>


    <!-- LANGUAGE -->

    <div class="section">

      <label class="label">
        Language
      </label>

      <div class="options">

        <button
          class="option selected"
          data-group="language"
          data-value="English"
          onclick="selectOption(this)">
          🇬🇧 English
        </button>

        <button
          class="option"
          data-group="language"
          data-value="Bangla"
          onclick="selectOption(this)">
          🇧🇩 বাংলা
        </button>

      </div>

    </div>


    <!-- CHARACTER -->

    <div class="section">

      <label class="label">
        Choose Character
      </label>

      <div class="options">

        <button
          class="option"
          data-group="character"
          data-value="Father"
          onclick="selectOption(this)">
          👨 Father
        </button>

        <button
          class="option"
          data-group="character"
          data-value="Mother"
          onclick="selectOption(this)">
          👩 Mother
        </button>

        <button
          class="option"
          data-group="character"
          data-value="Boyfriend"
          onclick="selectOption(this)">
          🧑 Boyfriend
        </button>

        <button
          class="option"
          data-group="character"
          data-value="Girlfriend"
          onclick="selectOption(this)">
          👩 Girlfriend
        </button>

        <button
          class="option"
          data-group="character"
          data-value="Male Teacher"
          onclick="selectOption(this)">
          👨‍🏫 Male Teacher
        </button>

        <button
          class="option"
          data-group="character"
          data-value="Female Teacher"
          onclick="selectOption(this)">
          👩‍🏫 Female Teacher
        </button>

        <button
          class="option"
          data-group="character"
          data-value="Other"
          onclick="selectOption(this)">
          ✨ Other
        </button>

      </div>


      <div
        class="custom-name"
        id="customNameBox">

        <input
          type="text"
          id="customCharacter"
          placeholder="Enter your character name">

      </div>

    </div>


    <!-- CHARACTER PICTURE -->

    <div class="section">

      <label class="label">
        Character Picture
      </label>

      <div class="avatar-section">

        <div
          class="avatar-preview"
          id="avatarPreview">
          👤
        </div>

        <div class="avatar-title">
          Set your character picture
        </div>

        <div class="avatar-description">
          Choose a picture for your character's avatar.
        </div>

        <label
          class="upload-button"
          for="avatarInput">
          🖼️ Choose Picture
        </label>

        <input
          type="file"
          id="avatarInput"
          accept="image/jpeg,image/png,image/webp">

        <button
          type="button"
          class="remove-avatar"
          id="removeAvatar"
          onclick="removeAvatar()">
          Remove picture
        </button>

        <div class="hint">
          JPG, PNG or WEBP • Maximum 5 MB
        </div>

      </div>

    </div>


    <!-- EXPERIENCE -->

    <div class="section">

      <label class="label">
        Chat Experience
      </label>

      <div class="options">

        <button
          class="option"
          data-group="experience"
          data-value="Romantic"
          onclick="selectOption(this)">
          💜 Romantic
        </button>

        <button
          class="option selected"
          data-group="experience"
          data-value="Normal"
          onclick="selectOption(this)">
          💬 Normal
        </button>

        <button
          class="option"
          data-group="experience"
          data-value="Calm"
          onclick="selectOption(this)">
          🌿 Calm
        </button>

      </div>

    </div>


    <button
      class="create-button"
      id="createButton"
      onclick="createCharacter()">

      Create Character

    </button>


    <div
      id="message"
      class="message">
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://bnagfjhghlncqqnenejn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CEOgfj8n1K6CeIqizGVhTw_8oPlWuKk";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;

let selectedLanguage =
  "English";

let selectedCharacter =
  null;

let selectedExperience =
  "Normal";

let selectedAvatar =
  null;


/* =========================
   AUTH
========================= */

async function init() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    window.location.replace(
      "index.html"
    );

    return;
  }


  currentUser =
    session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "name, role, status"
      )
      .eq(
        "id",
        currentUser.id
      )
      .single();


  if (
    error ||
    !profile ||
    profile.status !== "approved"
  ) {

    await supabaseClient.auth.signOut();

    window.location.replace(
      "index.html"
    );

    return;
  }
}


/* =========================
   SELECT OPTIONS
========================= */

function selectOption(
  button
) {

  const group =
    button.dataset.group;

  const value =
    button.dataset.value;


  document
    .querySelectorAll(
      `.option[data-group="${group}"]`
    )
    .forEach(
      item => {

        item.classList.remove(
          "selected"
        );

      }
    );


  button.classList.add(
    "selected"
  );


  if (
    group ===
    "language"
  ) {

    selectedLanguage =
      value;
  }


  if (
    group ===
    "character"
  ) {

    selectedCharacter =
      value;


    const customBox =
      document.getElementById(
        "customNameBox"
      );


    if (
      value === "Other"
    ) {

      customBox.style.display =
        "block";

    } else {

      customBox.style.display =
        "none";

      document.getElementById(
        "customCharacter"
      ).value = "";

    }
  }


  if (
    group ===
    "experience"
  ) {

    selectedExperience =
      value;
  }
}


/* =========================
   AVATAR SELECT
========================= */

document
  .getElementById(
    "avatarInput"
  )
  .addEventListener(
    "change",
    handleAvatarSelect
  );


function handleAvatarSelect(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    showError(
      "Please choose an image file."
    );

    event.target.value = "";

    return;
  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    showError(
      "Picture must be smaller than 5 MB."
    );

    event.target.value = "";

    return;
  }


  selectedAvatar =
    file;


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      document
        .getElementById(
          "avatarPreview"
        )
        .innerHTML = `
          <img
            src="${e.target.result}"
            alt="Character picture">
        `;


      document
        .getElementById(
          "removeAvatar"
        )
        .classList.add(
          "show"
        );

    };


  reader.readAsDataURL(
    file
  );
}


/* =========================
   REMOVE AVATAR
========================= */

function removeAvatar() {

  selectedAvatar =
    null;


  document.getElementById(
    "avatarInput"
  ).value = "";


  document.getElementById(
    "avatarPreview"
  ).innerHTML =
    "👤";


  document
    .getElementById(
      "removeAvatar"
    )
    .classList.remove(
      "show"
    );
}


/* =========================
   CREATE CHARACTER
========================= */

async function createCharacter() {

  clearMessage();


  if (!selectedCharacter) {

    showError(
      "Please choose a character."
    );

    return;
  }


  let customCharacter =
    null;


  if (
    selectedCharacter ===
    "Other"
  ) {

    customCharacter =
      document
        .getElementById(
          "customCharacter"
        )
        .value
        .trim();


    if (!customCharacter) {

      showError(
        "Please enter your character name."
      );

      return;
    }
  }


  const button =
    document.getElementById(
      "createButton"
    );


  button.disabled =
    true;


  button.textContent =
    "Creating...";


  try {

    let avatarPath =
      null;


    /* =========================
       UPLOAD AVATAR
    ========================= */

    if (selectedAvatar) {

      const extension =
        selectedAvatar.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        `${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const {
        error:
          uploadError
      } =
        await supabaseClient
          .storage
          .from(
            "character-avatars"
          )
          .upload(
            fileName,
            selectedAvatar,
            {
              contentType:
                selectedAvatar.type,

              upsert:
                false
            }
          );


      if (uploadError) {

        throw uploadError;
      }


      avatarPath =
        fileName;
    }


    /* =========================
       SAVE CHARACTER
    ========================= */

    const {
      data: character,
      error
    } =
      await supabaseClient
        .from("characters")
        .insert({

          user_id:
            currentUser.id,

          language:
            selectedLanguage,

          character_type:
            selectedCharacter,

          custom_character:
            customCharacter,

          chat_experience:
            selectedExperience,

          avatar_url:
            avatarPath

        })
        .select()
        .single();


    if (error) {

      throw error;
    }


    window.location.replace(
      `chat.html?id=${character.id}`
    );


  } catch (error) {

    console.error(
      error
    );


    showError(
      error.message ||
      "Could not create character."
    );


    button.disabled =
      false;

    button.textContent =
      "Create Character";
  }
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.replace(
    "index.html"
  );
}


/* =========================
   MESSAGE
========================= */

function showError(
  text
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message error";
}


function clearMessage() {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    "";


  message.className =
    "message";
}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
